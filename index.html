<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Article Dashboard</title>

    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/microscope.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary-slate: #0f172a;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --indigo-accent: #6366f1;
            --indigo-light: #eef2ff;
            --emerald-accent: #059669;
            --emerald-light: #ecfdf5;
            --summary-bg: #faf5ff;
            --summary-border: #8b5cf6;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 32px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 28px;
            text-align: left;
        }

        header .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-light);
            color: var(--accent-blue);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary-slate);
            margin: 0 0 6px 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
        }

        /* Sleek Search Panel Container */
        .search-container {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 28px;
            transition: box-shadow 0.2s ease;
        }

        .search-container:focus-within {
            box-shadow: var(--shadow-lg);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        input[type="text"] {
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        /* Toggle Button Groups */
        .toggle-group {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            color: var(--text-dark);
        }

        .toggle-btn.active {
            background-color: #ffffff;
            color: var(--accent-blue);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        /* Advanced Options Collapsible */
        .advanced-toggle {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }

        .advanced-toggle:hover {
            color: var(--accent-blue-hover);
        }

        .advanced-options {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
        }

        .advanced-options.show {
            display: grid;
        }

        .button-container {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn-submit {
            padding: 12px 28px;
            font-size: 14px;
            font-family: inherit;
            background-color: var(--primary-slate);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.15);
        }

        .btn-submit:hover {
            background-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        /* Sticky Tab Bar */
        .sticky-tab-bar {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 6px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
        }

        .sticky-tab-bar .toggle-group {
            background: transparent;
            padding: 0;
        }

        .sticky-tab-bar .toggle-btn {
            padding: 10px 14px;
        }

        /* Column Visibility Switch */
        .column-content {
            display: none;
        }

        .column-content.active {
            display: block;
        }

        /* Article Cards */
        .article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }

        .article-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .article-title {
            font-size: 18px;
            margin: 0;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .article-title a {
            color: var(--text-dark);
            text-decoration: none;
            display: inline-flex;
            align-items: flex-start;
            gap: 6px;
            transition: color 0.15s;
        }

        .article-title a:hover {
            color: var(--accent-blue);
        }

        /* Visual Pill Badges */
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .badge.citation {
            background-color: var(--accent-light);
            color: var(--accent-blue);
            font-weight: 700;
        }

        .badge.impact-factor {
            background-color: var(--emerald-light);
            color: var(--emerald-accent);
            font-weight: 700;
        }

        .badge.journal {
            background-color: var(--indigo-light);
            color: var(--indigo-accent);
        }

        .external-icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .authors {
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .institution {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        /* AI Summary Callout Box */
        .paper-summary {
            font-size: 13px;
            line-height: 1.6;
            color: #334155;
            background-color: var(--summary-bg);
            padding: 12px 16px;
            border-left: 3px solid var(--summary-border);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-top: 12px;
        }

        .paper-summary strong {
            color: #6d28d9;
            display: inline-block;
            margin-bottom: 2px;
        }

        .status-msg {
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Animated Skeleton Loader */
        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            margin-bottom: 18px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 640px) {
            body { padding: 16px 12px; }
            .search-grid, .advanced-options { grid-template-columns: 1fr; }
            .input-group.full-width, .button-container { grid-column: span 1; }
            .toggle-group { flex-direction: column; }
            .article-title-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-badge">🔬 Live Feed Dashboard</div>
        <h1>Research Article Intelligence</h1>
        <p class="subtitle">Filter and analyze literature by recency, citation impact, and journal rank.</p>
    </header>

    <!-- Search Controls -->
    <div class="search-container">
        <div class="search-grid">
            <div class="input-group full-width">
                <label for="topicInput">General Topic / Keywords</label>
                <input type="text" id="topicInput" placeholder="e.g. IL-33, B.1.640.1, COPD" value="COPD">
            </div>

            <div class="input-group full-width">
                <label>Paper Type Filter</label>
                <div class="toggle-group">
                    <button type="button" id="typeAll" class="toggle-btn active" onclick="setPaperType('all')">All Types</button>
                    <button type="button" id="typeResearch" class="toggle-btn" onclick="setPaperType('research')">Research Papers</button>
                    <button type="button" id="typeReview" class="toggle-btn" onclick="setPaperType('review')">Review Papers</button>
                </div>
            </div>
        </div>

        <!-- Advanced Filters Toggle -->
        <button type="button" class="advanced-toggle" onclick="toggleAdvancedOptions()">
            <span id="advancedToggleText">⚙️ Show Advanced Filters</span>
        </button>

        <div id="advancedOptions" class="advanced-options">
            <div class="input-group">
                <label for="titleInput">Title Keywords</label>
                <input type="text" id="titleInput" placeholder="e.g. Rhinovirus, Inflammation">
            </div>

            <div class="input-group">
                <label for="journalInput">Journal Name</label>
                <input type="text" id="journalInput" placeholder="e.g. Nature, Thorax">
            </div>

            <div class="input-group">
                <label for="authorInput">Author Name</label>
                <input type="text" id="authorInput" placeholder="e.g. Johnston SL">
            </div>

            <div class="input-group">
                <label for="limitInput">Max Results</label>
                <input type="text" id="limitInput" value="10">
            </div>
        </div>

        <div class="button-container">
            <button class="btn-submit" onclick="fetchAllColumns()">Fetch Articles</button>
        </div>
    </div>

    <!-- Sticky Navigation Tab Bar -->
    <div class="sticky-tab-bar">
        <div class="toggle-group">
            <button type="button" id="feedRecent" class="toggle-btn active" onclick="showColumn('recent')">⚡ Most Recent</button>
            <button type="button" id="feedCited1Y" class="toggle-btn" onclick="showColumn('cited1Y')">🔥 Top Cited (1 Yr)</button>
            <button type="button" id="feedCitedAll" class="toggle-btn" onclick="showColumn('citedAll')">🏆 Top Cited (All Time)</button>
            <button type="button" id="feedImpactFactor" class="toggle-btn" onclick="showColumn('impactFactor')">📊 Journal Impact Factor</button>
        </div>
    </div>

    <!-- Feed Columns -->
    <div id="col-recent" class="column-content active">
        <div id="recentStatus" class="status-msg"></div>
        <div id="recentResults"></div>
    </div>

    <div id="col-cited1Y" class="column-content">
        <div id="cited1YStatus" class="status-msg"></div>
        <div id="cited1YResults"></div>
    </div>

    <div id="col-citedAll" class="column-content">
        <div id="citedAllStatus" class="status-msg"></div>
        <div id="citedAllResults"></div>
    </div>

    <div id="col-impactFactor" class="column-content">
        <div id="impactFactorStatus" class="status-msg"></div>
        <div id="impactFactorResults"></div>
    </div>
</div>

<script>
let selectedPaperType = 'all';

function toggleAdvancedOptions() {
    const adv = document.getElementById('advancedOptions');
    const txt = document.getElementById('advancedToggleText');
    if (adv.classList.contains('show')) {
        adv.classList.remove('show');
        txt.innerText = '⚙️ Show Advanced Filters';
    } else {
        adv.classList.add('show');
        txt.innerText = '⚙️ Hide Advanced Filters';
    }
}

function setPaperType(type) {
    selectedPaperType = type;
    document.getElementById('typeAll').classList.toggle('active', type === 'all');
    document.getElementById('typeResearch').classList.toggle('active', type === 'research');
    document.getElementById('typeReview').classList.toggle('active', type === 'review');
    fetchAllColumns();
}

function showColumn(colKey) {
    ['recent', 'cited1Y', 'citedAll', 'impactFactor'].forEach(key => {
        document.getElementById(`col-${key}`).classList.remove('active');
    });

    document.getElementById('feedRecent').classList.toggle('active', colKey === 'recent');
    document.getElementById('feedCited1Y').classList.toggle('active', colKey === 'cited1Y');
    document.getElementById('feedCitedAll').classList.toggle('active', colKey === 'citedAll');
    document.getElementById('feedImpactFactor').classList.toggle('active', colKey === 'impactFactor');

    document.getElementById(`col-${colKey}`).classList.add('active');
}

function showSkeletons(containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton-line" style="width: 75%;"></div>
            <div class="skeleton-line" style="width: 35%;"></div>
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
        </div>
    `).join('');
}

function formatCleanDate(paper) {
    let rawDate = paper.pubdate || paper.sortfirstdate || paper.publication_date || "";
    if (!rawDate) return "N/A";

    const parts = rawDate.replace(/\//g, " ").replace(/-/g, " ").trim().split(/\s+/);
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    let year = parts.find(p => /^\d{4}$/.test(p));
    let month = parts.find(p => months.some(m => p.toLowerCase().startsWith(m.toLowerCase())));

    if (month && year) {
        const formattedMonth = month.charAt(0).toUpperCase() + month.slice(1, 3).toLowerCase();
        return `${formattedMonth} ${year}`;
    } else if (year) {
        return year;
    }

    return rawDate; 
}

function sanitizeTerm(str) {
    if (!str) return '';
    if (str.includes('.') && !str.startsWith('"')) {
        return `"${str}"`;
    }
    return str;
}

function buildPubMedQuery() {
    const topic   = sanitizeTerm(document.getElementById('topicInput').value.trim());
    const title   = sanitizeTerm(document.getElementById('titleInput').value.trim());
    const journal = document.getElementById('journalInput').value.trim();
    const author  = document.getElementById('authorInput').value.trim();

    let queryParts = [];
    if (topic)   queryParts.push(`${topic}[Title/Abstract]`);
    if (title)   queryParts.push(`${title}[Title]`);
    if (journal) queryParts.push(`${journal}[Journal]`);
    if (author)  queryParts.push(`${author}[Author]`);

    if (selectedPaperType === 'review') {
        queryParts.push(`review[PT]`);
    } else if (selectedPaperType === 'research') {
        queryParts.push(`(journal article[PT] NOT review[PT])`);
    }

    return queryParts.join(' AND ');
}

// Fetch Citation Counts via NIH iCite for PubMed
async function fetchCitationCounts(pmids) {
    if (!pmids || pmids.length === 0) return {};
    try {
        const response = await fetch(`https://icite.od.nih.gov/api/pubs?pmids=${pmids.join(',')}`);
        if (!response.ok) return {};
        const data = await response.json();

        const citationMap = {};
        if (data && data.data) {
            data.data.forEach(item => {
                citationMap[item.pmid] = item.citation_count ?? 0;
            });
        }
        return citationMap;
    } catch (e) {
        console.error("iCite API Error:", e);
        return {};
    }
}

const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

async function fetchAllColumns() {
    const limit = parseInt(document.getElementById('limitInput').value.trim(), 10) || 10;

    showSkeletons('recentResults');
    showSkeletons('cited1YResults');
    showSkeletons('citedAllResults');
    showSkeletons('impactFactorResults');

    await fetchRecentPubMed(limit);
    await sleep(250); 
    await fetchOpenAlexTopCited(limit, 1, 'cited1YStatus', 'cited1YResults');
    await sleep(250);
    await fetchOpenAlexTopCited(limit, null, 'citedAllStatus', 'citedAllResults');
    await sleep(250);
    await fetchOpenAlexImpactFactor(limit);
}

// Helper to reconstruct abstract from OpenAlex inverted index
function getAbstractFromInvertedIndex(invertedIndex) {
    if (!invertedIndex) return '';
    try {
        let maxPos = -1;
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                if (pos > maxPos) maxPos = pos;
            }
        }
        if (maxPos === -1) return '';
        let words = new Array(maxPos + 1);
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                words[pos] = word;
            }
        }
        return words.join(' ');
    } catch (e) {
        return '';
    }
}

// Heuristic Takeaway Engine
function extractTakeaway(abstractText) {
    if (!abstractText || abstractText.trim().length === 0) {
        return "Summary unavailable for this paper.";
    }

    const cleanText = abstractText.trim();
    const sentences = cleanText
        .split(/(?<=[.!?])\s+(?=[A-Z])/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

    if (sentences.length === 0) return cleanText;

    const conclusionTriggers = [
        "conclude that", "demonstrate that", "demonstrated that", "show that", 
        "showed that", "suggest that", "suggests that", "found that", 
        "results indicate", "results show", "findings indicate", "in conclusion", 
        "overall,", "taken together", "we identified", "our data suggest"
    ];

    for (let sentence of sentences) {
        const lower = sentence.toLowerCase();
        if (conclusionTriggers.some(trigger => lower.includes(trigger))) {
            return sentence;
        }
    }

    if (sentences.length > 1) {
        const lastSentence = sentences[sentences.length - 1];
        if (lastSentence.length > 25) {
            return lastSentence;
        }
    }

    return sentences[0];
}

// 1. Most Recent Feed via PubMed
async function fetchRecentPubMed(limit) {
    const baseQuery = buildPubMedQuery();
    const statusDiv = document.getElementById('recentStatus');
    const resultsDiv = document.getElementById('recentResults');
    statusDiv.innerText = "Loading latest papers...";

    if (!baseQuery) {
        statusDiv.innerText = "Please fill in at least one search field.";
        resultsDiv.innerHTML = "";
        return;
    }

    try {
        const searchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/esearch.fcgi?db=pubmed&term=${encodeURIComponent(baseQuery)}&sort=pub_date&retmax=${limit}&retmode=json`;
        const searchRes = await fetch(searchUrl);
        if (!searchRes.ok) throw new Error(`HTTP error ${searchRes.status}`);

        const searchData = await searchRes.json();
        const idList = searchData?.esearchresult?.idlist;

        if (!idList || idList.length === 0) {
            statusDiv.innerText = "No recent papers found matching your filters.";
            resultsDiv.innerHTML = "";
            return;
        }

        const fetchUrl = `https://eutils.ncbi.nlm.nih.gov/entrez/eutils/efetch.fcgi?db=pubmed&id=${idList.join(',')}&retmode=xml`;
        const fetchRes = await fetch(fetchUrl);
        const xmlText = await fetchRes.text();
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");
        const articles = xmlDoc.getElementsByTagName("PubmedArticle");

        const citationMap = await fetchCitationCounts(idList);

        statusDiv.innerText = `Displaying ${articles.length} articles:`;
        resultsDiv.innerHTML = "";
        const externalIconSvg = `<svg class="external-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;

        Array.from(articles).forEach(art => {
            const pmid = art.querySelector("PMID")?.textContent || "";
            const title = art.querySelector("ArticleTitle")?.textContent || "Untitled Paper";
            const journal = art.querySelector("Title")?.textContent || art.querySelector("ISOAbbreviation")?.textContent || "N/A";

            const pubDate = art.querySelector("JournalIssue PubDate");
            const year = pubDate?.querySelector("Year")?.textContent || "";
            const month = pubDate?.querySelector("Month")?.textContent || "";
            const cleanDate = month ? `${month} ${year}` : year || "N/A";

            const authorEls = art.querySelectorAll("AuthorList Author");
            let authorNames = "Unknown Authors";
            let firstInstitution = "N/A";

            if (authorEls.length > 0) {
                const names = Array.from(authorEls).map(a => {
                    const lastName = a.querySelector("LastName")?.textContent || "";
                    const initials = a.querySelector("Initials")?.textContent || "";
                    return `${lastName} ${initials}`.trim();
                }).filter(Boolean);
                authorNames = names.slice(0, 5).join(', ') + (names.length > 5 ? ' et al.' : '');

                const firstAuthorAff = authorEls[0].querySelector("AffiliationInfo Affiliation")?.textContent || "";
                if (firstAuthorAff) {
                    firstInstitution = firstAuthorAff.replace(/\.$/, '');
                }
            }

            const abstractEls = art.querySelectorAll("AbstractText");
            let abstractText = Array.from(abstractEls).map(a => a.textContent).join(" ");
            const summaryStr = extractTakeaway(abstractText);

            const citations = citationMap[pmid] ?? 0;

            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <div class="article-title-row">
                    <h3 class="article-title">
                        <a href="https://pubmed.ncbi.nlm.nih.gov/${pmid}/" target="_blank" rel="noopener">
                            <span>${title}</span>
                            ${externalIconSvg}
                        </a>
                    </h3>
                </div>
                <div class="badge-row">
                    <span class="badge citation">📌 ${citations.toLocaleString()} ${citations === 1 ? 'citation' : 'citations'}</span>
                    <span class="badge journal">📖 ${journal}</span>
                    <span class="badge">📅 ${cleanDate}</span>
                </div>
                <div class="authors">
                    <strong>Authors:</strong> ${authorNames}
                </div>
                <div class="institution">
                    <strong>Institution (1st Author):</strong> ${firstInstitution}
                </div>
                <div class="paper-summary">
                    <strong>📝 Takeaway:</strong> ${summaryStr}
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    } catch (e) {
        console.error("Recent PubMed Error:", e);
        statusDiv.innerText = "Unable to load papers.";
        resultsDiv.innerHTML = "";
    }
}

    if (title) {
