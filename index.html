<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literature Search</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary-slate: #0f172a;
            --accent-blue: #2563eb;
            --accent-light: #eff6ff;
            --indigo-accent: #6366f1;
            --indigo-light: #eef2ff;
            --summary-bg: #faf5ff;
            --summary-border: #8b5cf6;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 32px 16px;
            line-height: 1.5;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header { margin-bottom: 24px; }
        header .header-badge {
            display: inline-flex;
            align-items: center;
            background: var(--accent-light);
            color: var(--accent-blue);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        h1 { color: var(--primary-slate); margin: 0 0 6px 0; font-size: 28px; font-weight: 700; }
        .subtitle { color: var(--text-muted); margin: 0; font-size: 14px; }

        .search-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 20px;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: #f8fafc;
        }

        .search-input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn-search {
            padding: 12px 24px;
            background: var(--primary-slate);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-search:hover { background: var(--accent-blue); }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .chip-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-right: 4px; }

        .chip {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover { color: var(--text-dark); background: #e2e8f0; }
        .chip.active { background: var(--accent-light); color: var(--accent-blue); border-color: var(--accent-blue); }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        select {
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            color: var(--text-dark);
            cursor: pointer;
        }

        .article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .article-title { font-size: 17px; margin: 0 0 10px 0; font-weight: 700; }
        .article-title a { color: var(--text-dark); text-decoration: none; }
        .article-title a:hover { color: var(--accent-blue); }

        .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #f1f5f9; color: var(--text-muted); }
        .badge.citation { background: var(--accent-light); color: var(--accent-blue); }
        .badge.journal { background: var(--indigo-light); color: var(--indigo-accent); }

        .authors { font-size: 13px; margin-bottom: 4px; }
        .paper-summary {
            font-size: 13px;
            line-height: 1.5;
            background: var(--summary-bg);
            padding: 10px 14px;
            border-left: 3px solid var(--summary-border);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-top: 10px;
        }

        .status-msg { font-weight: 600; margin-bottom: 16px; color: var(--text-muted); font-size: 14px; }

        .skeleton-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 20px; margin-bottom: 16px; }
        .skeleton-line { height: 14px; background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px; margin-bottom: 10px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        @media (max-width: 640px) { .filter-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-badge">Respiratory Engine</div>
        <h1>Literature Search</h1>
        <p class="subtitle">Real-time search across scientific literature.</p>
    </header>

    <div class="search-card">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="Search topics, keywords, or titles (e.g., COPD, IL-33, Asthma)..." value="COPD">
            <button class="btn-search" onclick="fetchArticles()">Search</button>
        </div>

        <div class="filter-chips">
            <span class="chip-label">Type:</span>
            <button class="chip active" id="chipAll" onclick="setPaperType('all')">All</button>
            <button class="chip" id="chipResearch" onclick="setPaperType('research')">Research</button>
            <button class="chip" id="chipReview" onclick="setPaperType('review')">Reviews</button>
        </div>

        <div class="filter-chips" style="margin-top: 10px;">
            <span class="chip-label">Impact Factor:</span>
            <button class="chip" id="chipHighImpact" onclick="toggleImpactFilter()">IF &gt; 10 only</button>
        </div>

        <div class="filter-row">
            <div>
                <select id="sortSelect" onchange="fetchArticles()" style="width: 100%;">
                    <option value="recent" selected>Most Recent</option>
                    <option value="cited2Y">Top Cited (2 Years)</option>
                    <option value="citedAll">Top Cited (All Time)</option>
                </select>
            </div>

            <div>
                <select id="limitSelect" onchange="fetchArticles()" style="width: 100%;">
                    <option value="10" selected>10 Results</option>
                    <option value="20">20 Results</option>
                    <option value="30">30 Results</option>
                </select>
            </div>
        </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div id="resultsContainer"></div>
</div>

<script>
let selectedPaperType = 'all';
let showHighImpactOnly = false;
let lastFetchedWorks = [];

// Manually curated snapshot of Journal Impact Factors (Clarivate JCR has no free public API,
// so this can't be fetched live). Figures below are from the most recent JCR release
// (June 2026, based on 2025 citation data) where available, otherwise the latest figure found.
// Keys are lowercase, trailing period stripped, for matching against Europe PMC's journal title.
// This list is inevitably partial and will drift out of date — extend/update it as needed.
const JOURNAL_IMPACT_FACTORS = {
    "nature": 50.5,
    "science": 44.7,
    "cell": 45.5,
    "nature medicine": 58.7,
    "nature immunology": 27.7,
    "nature reviews immunology": 54.4,
    "nature communications": 14.7,
    "cell reports": 7.5,
    "pnas": 9.4,
    "proceedings of the national academy of sciences of the united states of america": 9.4,
    "immunity": 25.5,
    "science immunology": 17.6,
    "journal of experimental medicine": 12.5,
    "embo journal": 8.5,
    "embo reports": 7.2,
    "journal of clinical investigation": 12.0,
    "new england journal of medicine": 96.2,
    "lancet": 98.4,
    "the lancet": 98.4,
    "jama": 63.1,
    "lancet respiratory medicine": 34.7,
    "the lancet. respiratory medicine": 34.7,
    "european respiratory journal": 23.8,
    "american journal of respiratory and critical care medicine": 21.7,
    "european respiratory review": 10.8,
    "chest": 9.8,
    "thorax": 9.1,
    "journal of allergy and clinical immunology": 11.2,
    "journal of allergy and clinical immunology. in practice": 7.2,
    "allergy": 12.6,
    "mucosal immunology": 7.6,
    "american journal of respiratory cell and molecular biology": 5.3,
};

function getJournalImpactFactor(journalName) {
    if (!journalName) return null;
    const key = journalName.toLowerCase().replace(/\.$/, '').trim();
    return Object.prototype.hasOwnProperty.call(JOURNAL_IMPACT_FACTORS, key) ? JOURNAL_IMPACT_FACTORS[key] : null;
}

function toggleImpactFilter() {
    showHighImpactOnly = !showHighImpactOnly;
    document.getElementById('chipHighImpact').classList.toggle('active', showHighImpactOnly);
    renderResults(lastFetchedWorks);
}

// "IL-33", "IL33" and "IL 33" should all be treated as the same term. Also, Europe PMC's query
// parser can treat a bare hyphen as a NOT operator (e.g. IL-33 unquoted risks parsing as
// "IL, not 33"), so every variant gets wrapped in quotes to force literal phrase matching.
function expandTermVariants(token) {
    const variants = new Set([token]);
    const m = token.match(/^([A-Za-z]+)-?\s?(\d[\dA-Za-z]*)$/);
    if (m) {
        const [, letters, rest] = m;
        variants.add(`${letters}${rest}`);
        variants.add(`${letters}-${rest}`);
        variants.add(`${letters} ${rest}`);
    }
    return Array.from(variants);
}

// Scopes a single search token to TITLE/ABSTRACT only (so results are guaranteed relevant,
// rather than matching stray full-text/keyword noise), across all of its spelling variants.
function buildTokenQuery(token) {
    const variants = expandTermVariants(token);
    const clauses = variants.flatMap(v => [`TITLE:"${v}"`, `ABSTRACT:"${v}"`]);
    return `(${clauses.join(' OR ')})`;
}

// Builds the full search query: each whitespace-separated word/term in the user's input must
// appear (in some spelling variant) in the title or abstract.
function buildSearchQuery(rawQuery) {
    const tokens = rawQuery.trim().split(/\s+/).filter(Boolean);
    if (tokens.length === 0) return '';
    return tokens.map(buildTokenQuery).join(' AND ');
}

function setPaperType(type) {
    selectedPaperType = type;
    document.getElementById('chipAll').classList.toggle('active', type === 'all');
    document.getElementById('chipResearch').classList.toggle('active', type === 'research');
    document.getElementById('chipReview').classList.toggle('active', type === 'review');
    fetchArticles();
}

function showSkeletons() {
    const container = document.getElementById('resultsContainer');
    container.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton-line" style="width: 70%;"></div>
            <div class="skeleton-line" style="width: 30%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
        </div>
    `).join('');
}

function escapeHtml(str) {
    if (typeof str !== 'string') return str;
    return str.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

// Europe PMC embeds real formatting tags in titles/abstracts (<i>Nras</i>, <sup>G12D</sup>,
// <h4>Conclusion</h4> section headers). Blanket-escaping those turns them into visible "&lt;i&gt;"
// junk. This walks the string, keeps a small whitelist of inline formatting tags as real HTML,
// silently drops any other tag (keeping its inner text), and escapes everything else so nothing
// unrecognised can inject markup.
function sanitizeMarkup(str) {
    if (typeof str !== 'string') return str;
    const allowed = ['i', 'b', 'sup', 'sub', 'u', 'em', 'strong'];
    const tagPattern = /<\/?([a-zA-Z][a-zA-Z0-9]*)\b[^>]*>/g;
    let result = '';
    let lastIndex = 0;
    let match;
    while ((match = tagPattern.exec(str)) !== null) {
        result += escapeHtml(str.slice(lastIndex, match.index));
        const tagName = match[1].toLowerCase();
        const isClosing = match[0].startsWith('</');
        if (allowed.includes(tagName)) {
            result += isClosing ? `</${tagName}>` : `<${tagName}>`;
        }
        lastIndex = tagPattern.lastIndex;
    }
    result += escapeHtml(str.slice(lastIndex));
    return result;
}

// Pulls a conclusion out of the abstract itself: structured abstracts (BACKGROUND/METHODS/
// RESULTS/CONCLUSION...) get their labelled CONCLUSION section; unstructured abstracts fall
// back to their final 1-2 sentences as a proxy.
function extractConclusionFromAbstract(abstractText) {
    if (!abstractText || !abstractText.trim()) {
        return { text: "No abstract available for this paper.", labelled: false };
    }
    const text = abstractText.trim();

    // Structured abstracts marked up with real heading tags, e.g. <h4>Conclusion</h4>...text
    const htmlHeadingMatch = text.match(/<h[1-6]>\s*(?:conclusions?(?:\s+and\s+relevance)?|summary|in conclusion)\s*<\/h[1-6]>\s*([\s\S]*?)(?:<h[1-6]>|$)/i);
    if (htmlHeadingMatch && htmlHeadingMatch[1] && htmlHeadingMatch[1].trim().length > 15) {
        return { text: htmlHeadingMatch[1].trim(), labelled: true };
    }

    // Plain-text structured abstracts, e.g. "CONCLUSIONS: text..."
    const labelMatch = text.match(/(?:CONCLUSIONS?(?:\s+AND\s+RELEVANCE)?|SUMMARY|IN CONCLUSION)\s*[:.]\s*([\s\S]*?)(?:\s*[A-Z][A-Z\s]{3,}:|$)/i);
    if (labelMatch && labelMatch[1] && labelMatch[1].trim().length > 15) {
        return { text: labelMatch[1].trim(), labelled: true };
    }

    const sentences = text.split(/(?<=[.!?])\s+(?=[A-Z])/);
    const tail = sentences.slice(-2).join(' ').trim();
    return { text: tail || sentences[0], labelled: false };
}

// Best-effort fetch of the real conclusion section from open-access full text (JATS XML).
// Returns null (rather than throwing) on any failure so callers can just keep the abstract-based fallback.
async function fetchFullTextConclusion(source, id) {
    if (!source || !id) return null;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 7000);
    try {
        const res = await fetch(`https://www.ebi.ac.uk/europepmc/webservices/rest/${source}/${id}/fullTextXML`, { signal: controller.signal });
        if (!res.ok) return null;
        const xmlText = await res.text();
        const doc = new DOMParser().parseFromString(xmlText, "application/xml");
        if (doc.querySelector('parsererror')) return null;

        const sections = Array.from(doc.querySelectorAll('sec'));
        const concSection = sections.find(sec => {
            const type = (sec.getAttribute('sec-type') || '').toLowerCase();
            const titleEl = sec.querySelector(':scope > title');
            const titleText = titleEl ? titleEl.textContent.toLowerCase() : '';
            return type.includes('conclu') || titleText.includes('conclu') || titleText.includes('summary');
        });
        if (!concSection) return null;

        const combined = Array.from(concSection.querySelectorAll('p')).map(p => p.textContent.trim()).filter(Boolean).join(' ').trim();
        if (!combined) return null;
        return combined.length > 600 ? combined.slice(0, 600).trim() + '…' : combined;
    } catch (e) {
        return null;
    } finally {
        clearTimeout(timeoutId);
    }
}

// Pulls the first author's affiliation string out of the core-format authorList.
function getFirstAuthorAffiliation(work) {
    const authors = work.authorList && work.authorList.author;
    if (!authors || !authors.length) return null;
    const first = authors[0];
    let aff = first.affiliation;
    if (!aff && first.authorAffiliationDetailsList?.authorAffiliation?.length) {
        aff = first.authorAffiliationDetailsList.authorAffiliation[0].affiliation;
    }
    if (!aff) return null;
    return { name: first.fullName || `${first.firstName || ''} ${first.lastName || ''}`.trim(), affiliation: aff.trim() };
}

// Heuristic: an affiliation string is usually "Dept X, Institute Y, City, Country" —
// find the segment that actually names an institution rather than a department or address.
function extractInstituteName(affiliationStr) {
    if (!affiliationStr) return null;
    const parts = affiliationStr.split(/[,;]/).map(p => p.trim()).filter(Boolean);
    const keyword = /(university|institute|college|hospital|centre|center|school|laborator|academy|foundation|EMBL|CNRS)/i;
    const match = parts.find(p => keyword.test(p));
    return (match || parts[0] || affiliationStr).trim();
}

// Best-effort Wikipedia summary for the institute name. Returns null if there's no matching page.
async function fetchInstituteOverview(instituteName) {
    if (!instituteName) return null;
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 6000);
    try {
        const res = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(instituteName)}`, { signal: controller.signal });
        if (!res.ok) return null;
        const data = await res.json();
        return data.extract || null;
    } catch (e) {
        return null;
    } finally {
        clearTimeout(timeoutId);
    }
}

// Robust date-desc comparator used as a client-side safety net on top of the API's own sort,
// so "Most Recent" is guaranteed correct even for records with only a partial pubYear.
function getComparableDate(work) {
    if (work.firstPublicationDate) return new Date(work.firstPublicationDate);
    if (work.pubYear) return new Date(`${work.pubYear}-01-01`);
    return new Date(0);
}

function renderResults(works) {
    const statusDiv = document.getElementById('statusMsg');
    const resultsDiv = document.getElementById('resultsContainer');

    let displayWorks = works;
    if (showHighImpactOnly) {
        displayWorks = works.filter(work => {
            const journalName = work.journalInfo?.journal?.title || '';
            const jif = getJournalImpactFactor(journalName);
            return jif !== null && jif > 10;
        });
    }

    if (displayWorks.length === 0) {
        statusDiv.innerText = showHighImpactOnly
            ? "No articles from journals with a known impact factor above 10 in this result set."
            : "No articles found matching your query.";
        resultsDiv.innerHTML = "";
        return;
    }

    statusDiv.innerText = showHighImpactOnly
        ? `Displaying ${displayWorks.length} of ${works.length} articles (impact factor > 10):`
        : `Displaying ${displayWorks.length} articles:`;
    resultsDiv.innerHTML = "";

    displayWorks.forEach((work, idx) => {
        const titleStr = work.title ? work.title.replace(/\.$/, '') : "Untitled Paper";
        const citations = work.citedByCount || 0;
        const pubDate = work.firstPublicationDate || work.pubYear || "N/A";
        const journalName = work.journalInfo?.journal?.title || 'Journal name unavailable';

        let url = "#";
        if (work.doi) {
            url = `https://doi.org/${work.doi}`;
        } else if (work.pmid) {
            url = `https://pubmed.ncbi.nlm.nih.gov/${work.pmid}/`;
        }

        const abstractText = work.abstractText || '';
        const conclusion = extractConclusionFromAbstract(abstractText);
        const authorList = work.authorString || 'Unknown Authors';

        const firstAuthorAff = getFirstAuthorAffiliation(work);
        const instituteName = firstAuthorAff ? extractInstituteName(firstAuthorAff.affiliation) : null;

        const cardId = `${idx}-${(work.id || '').toString()}`.replace(/[^a-zA-Z0-9-_]/g, '');

        const card = document.createElement('div');
        card.className = 'article-card';
        card.innerHTML = `
            <h3 class="article-title"><a href="${url}" target="_blank" rel="noopener">${sanitizeMarkup(titleStr)}</a></h3>
            <div class="badge-row">
                <span class="badge citation">${citations.toLocaleString()} citations</span>
                <span class="badge journal">${escapeHtml(journalName)}</span>
                <span class="badge">${escapeHtml(String(pubDate))}</span>
            </div>
            <div class="authors"><strong>Authors:</strong> ${escapeHtml(authorList)}</div>
            <div class="authors" id="institute-${cardId}">
                <strong>First Author's Institute:</strong> ${
                    firstAuthorAff
                        ? escapeHtml(firstAuthorAff.affiliation)
                        : "Affiliation not available for this record."
                }
            </div>
            <div class="paper-summary" id="conclusion-${cardId}">
                <strong>Conclusion${conclusion.labelled ? '' : ' (from abstract)'}:</strong> ${sanitizeMarkup(conclusion.text)}
            </div>
        `;
        resultsDiv.appendChild(card);

        // Progressive enhancement 1: for open-access papers, try to swap the abstract-based
        // conclusion for the real Conclusion section pulled from the full text.
        if (work.isOpenAccess === 'Y' && work.source && work.id) {
            fetchFullTextConclusion(work.source, work.id).then(fullConclusion => {
                if (!fullConclusion) return;
                const el = document.getElementById(`conclusion-${cardId}`);
                if (el) el.innerHTML = `<strong>Conclusion (from full text):</strong> ${sanitizeMarkup(fullConclusion)}`;
            });
        }

        // Progressive enhancement 2: look up a brief overview of the first author's institute.
        if (instituteName) {
            fetchInstituteOverview(instituteName).then(overview => {
                const el = document.getElementById(`institute-${cardId}`);
                if (!el || !overview) return;
                el.innerHTML = `<strong>${escapeHtml(instituteName)}:</strong> ${escapeHtml(overview)}`;
            });
        }
    });
}

async function fetchArticles() {
    const limit = parseInt(document.getElementById('limitSelect').value, 10) || 10;
    const sortVal = document.getElementById('sortSelect').value;
    const query = document.getElementById('searchInput').value.trim() || 'COPD';

    const statusDiv = document.getElementById('statusMsg');
    const resultsDiv = document.getElementById('resultsContainer');

    showSkeletons();
    statusDiv.innerText = "Searching articles...";

    // Build Europe PMC query terms, scoped to TITLE/ABSTRACT with hyphen-variant expansion
    let queryString = buildSearchQuery(query) || `(TITLE:"${query}" OR ABSTRACT:"${query}")`;

    if (selectedPaperType === 'review') {
        queryString += ' AND (PUB_TYPE:"Review" OR PUB_TYPE:"Systematic Review")';
    } else if (selectedPaperType === 'research') {
        queryString += ' AND PUB_TYPE:"Journal Article"';
    }

    if (sortVal === 'cited2Y') {
        const currentYear = new Date().getFullYear();
        queryString += ` AND (PUB_YEAR:${currentYear - 2} OR PUB_YEAR:${currentYear - 1} OR PUB_YEAR:${currentYear})`;
    }

    let sortParam = "P_PDATE_D desc"; // Default: Most Recent (Europe PMC's field is P_PDATE_D, not P_PD_DATE)
    if (sortVal === 'cited2Y' || sortVal === 'citedAll') {
        sortParam = "CITED desc";
    }

    const apiUrl = `https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=${encodeURIComponent(queryString)}&resultType=core&sort=${encodeURIComponent(sortParam)}&pageSize=${limit}&format=json`;

    try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const works = data.resultList?.result || [];

        // Safety net: guarantee strict most-recent-first order regardless of any API quirk.
        if (sortVal === 'recent') {
            works.sort((a, b) => getComparableDate(b) - getComparableDate(a));
        }

        lastFetchedWorks = works;

        if (works.length === 0) {
            statusDiv.innerText = "No articles found matching your query.";
            resultsDiv.innerHTML = "";
            return;
        }

        renderResults(works);
    } catch (e) {
        console.error("Fetch Error:", e);
        statusDiv.innerText = "Failed to load articles.";
        resultsDiv.innerHTML = "";
    }
}

document.getElementById('searchInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') fetchArticles();
});

window.addEventListener('DOMContentLoaded', fetchArticles);
</script>
</body>
</html>
