<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Article Dashboard</title>

    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/microscope.png">
    
    <!-- Sleek Typography: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Sleek Professional Palette */
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary-navy: #0f172a;
            --primary-slate: #334155;
            --accent-teal: #0d9488;
            --accent-teal-hover: #0f766e;
            --accent-teal-light: #ccfbf1;
            --accent-blue: #2563eb;
            --accent-blue-light: #eff6ff;
            --summary-indigo: #6366f1;
            --summary-bg: #f8fafc;
            --badge-if-bg: #fef3c7;
            --badge-if-text: #b45309;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 10px;
            --radius-md: 6px;
            --radius-sm: 4px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 28px 16px;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 880px;
            width: 100%;
            margin: 0 auto;
        }

        /* Hero Header Styling */
        header {
            margin-bottom: 24px;
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            background: var(--primary-navy);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            flex-shrink: 0;
        }

        .header-icon svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.75;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            color: var(--primary-navy);
            margin: 0;
            font-size: clamp(20px, 3.5vw, 26px);
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.2;
            word-break: break-word;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: clamp(13px, 2vw, 14px);
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: -0.01em;
        }

        /* Search Panel Container */
        .search-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.03);
            padding: clamp(16px, 3vw, 24px);
            margin-bottom: 24px;
            width: 100%;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .input-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
        }

        input[type="text"] {
            width: 100%;
            padding: 9px 12px;
            font-family: inherit;
            font-size: 13.5px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: #ffffff;
            color: var(--text-dark);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-navy);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.08);
        }

        /* Clean Toggle Button Groups */
        .toggle-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            width: 100%;
        }

        .toggle-btn {
            flex: 1 1 110px;
            padding: 8px 12px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.01em;
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            text-align: center;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .toggle-btn:hover {
            color: var(--primary-navy);
            background-color: #e2e8f0;
        }

        .toggle-btn.active {
            background-color: var(--primary-navy);
            color: #ffffff;
            font-weight: 500;
        }

        /* Advanced Options Collapsible */
        .advanced-toggle {
            background: none;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            padding: 0;
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s;
        }

        .advanced-toggle:hover {
            color: var(--primary-navy);
        }

        .advanced-options {
            display: none;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .advanced-options.show {
            display: grid;
        }

        .button-container {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .btn-submit {
            width: 100%;
            max-width: 180px;
            padding: 9px 20px;
            font-family: inherit;
            font-size: 13.5px;
            background-color: var(--primary-navy);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            letter-spacing: -0.01em;
            transition: background-color 0.15s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: var(--primary-slate);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Sticky Tab Bar */
        .sticky-tab-bar {
            position: sticky;
            top: 12px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            padding: 5px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        .sticky-tab-bar .toggle-group {
            flex-wrap: nowrap;
            min-width: min-content;
        }

        .sticky-tab-bar .toggle-btn {
            flex: 1 0 auto;
            min-width: 90px;
        }

        /* Article Cards */
        .article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: clamp(16px, 2.5vw, 20px);
            margin-bottom: 14px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.02);
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
            overflow: hidden;
        }

        .article-card:hover {
            box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.06);
            border-color: var(--border-hover);
        }

        .article-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .article-title {
            font-size: clamp(15px, 2.2vw, 16.5px);
            margin: 0;
            line-height: 1.4;
            font-weight: 600;
            letter-spacing: -0.015em;
            word-break: break-word;
        }

        .article-title a {
            color: var(--primary-navy);
            text-decoration: none;
            display: inline-flex;
            align-items: flex-start;
            gap: 6px;
            transition: color 0.15s;
        }

        .article-title a:hover {
            color: var(--accent-teal);
        }

        /* Pill Badges */
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 9px;
            border-radius: var(--radius-sm);
            font-size: 11.5px;
            font-weight: 500;
            letter-spacing: -0.01em;
            background-color: #f1f5f9;
            color: var(--text-muted);
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .badge.citation {
            background-color: var(--accent-blue-light);
            color: var(--accent-blue);
            font-weight: 600;
        }

        .badge.if-badge {
            background-color: var(--badge-if-bg);
            color: var(--badge-if-text);
            font-weight: 600;
        }

        .external-icon {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .authors {
            font-size: 12.5px;
            color: var(--text-dark);
            margin-bottom: 4px;
            word-break: break-word;
        }

        .institution {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
            word-break: break-word;
        }

        /* Summary Callout */
        .paper-summary {
            font-size: 12.5px;
            line-height: 1.55;
            color: #334155;
            background-color: var(--summary-bg);
            padding: 10px 12px;
            border-left: 2px solid var(--summary-indigo);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-top: 8px;
            word-break: break-word;
        }

        .paper-summary strong {
            color: var(--primary-navy);
            display: inline-block;
            margin-bottom: 2px;
            font-weight: 600;
        }

        .status-msg {
            font-weight: 500;
            margin-bottom: 14px;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* Skeleton Loading */
        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 14px;
        }

        .skeleton-line {
            height: 13px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 3px;
            margin-bottom: 10px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 600px) {
            body { padding: 16px 12px; }
            .button-container { justify-content: stretch; }
            .btn-submit { max-width: 100%; }
            .toggle-btn { flex: 1 1 100%; }
            .sticky-tab-bar .toggle-btn { flex: 1 0 auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title-wrapper">
            <div class="header-icon">
                <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            </div>
            <h1>Research Article Dashboard</h1>
        </div>
        <p class="subtitle">Discover real-time scientific literature filtered by journal citation impact factors.</p>
    </header>

    <div class="search-container">
        <div class="search-grid">
            <div class="input-group full-width">
                <label for="topicInput">General Topic / Keywords</label>
                <input type="text" id="topicInput" placeholder="e.g. IL-33, B.1.640.1, COPD" value="COPD">
            </div>

            <div class="input-group full-width">
                <label>Paper Type Filter</label>
                <div class="toggle-group">
                    <button type="button" id="typeAll" class="toggle-btn active" onclick="setPaperType('all')">All Types</button>
                    <button type="button" id="typeResearch" class="toggle-btn" onclick="setPaperType('research')">Research Papers</button>
                    <button type="button" id="typeReview" class="toggle-btn" onclick="setPaperType('review')">Review Papers</button>
                </div>
            </div>
        </div>

        <button type="button" class="advanced-toggle" onclick="toggleAdvancedOptions()">
            <span id="advancedToggleText">Show Advanced Filters</span>
        </button>

        <div id="advancedOptions" class="advanced-options">
            <div class="input-group">
                <label for="titleInput">Title Keywords</label>
                <input type="text" id="titleInput" placeholder="e.g. Rhinovirus, Inflammation">
            </div>

            <div class="input-group">
                <label for="journalInput">Journal Name</label>
                <input type="text" id="journalInput" placeholder="e.g. Nature, Thorax">
            </div>

            <div class="input-group">
                <label for="authorInput">Author Name</label>
                <input type="text" id="authorInput" placeholder="e.g. Johnston SL">
            </div>

            <div class="input-group">
                <label for="limitInput">Max Results</label>
                <input type="text" id="limitInput" value="10">
            </div>
        </div>

        <div class="button-container">
            <button class="btn-submit" id="btnSubmit" onclick="fetchArticles()">Fetch Articles</button>
        </div>
    </div>

    <!-- Impact Factor Tabs -->
    <div class="sticky-tab-bar">
        <div class="toggle-group">
            <button type="button" id="tab-0" class="toggle-btn active" onclick="setIFThreshold(0)">All Journals</button>
            <button type="button" id="tab-5" class="toggle-btn" onclick="setIFThreshold(5)">IF &gt; 5</button>
            <button type="button" id="tab-10" class="toggle-btn" onclick="setIFThreshold(10)">IF &gt; 10</button>
            <button type="button" id="tab-20" class="toggle-btn" onclick="setIFThreshold(20)">IF &gt; 20</button>
        </div>
    </div>

    <div>
        <div id="statusMessage" class="status-msg"></div>
        <div id="articlesContainer"></div>
    </div>
</div>

<script>
let selectedPaperType = 'all';
let currentIFThreshold = 0;

// Built-in Offline Fallback Dataset (Guarantees content if client network blocks public APIs)
const FALLBACK_ARTICLES = [
    {
        title: "Airway inflammation and immune responses in COPD exacerbations",
        journal: "Thorax",
        cited_by_count: 245,
        est_if: 9.1,
        pubdate: "2023",
        authors: "Johnston SL, Mallia P, et al.",
        institution: "Imperial College London",
        summary: "Demonstrated that viral infections trigger acute inflammatory pathways during COPD exacerbations.",
        doi: "https://doi.org/10.1136/thoraxjnl-2022-218900"
    },
    {
        title: "Single-cell transcriptome profiling of lung tissue in chronic obstructive pulmonary disease",
        journal: "Nature Medicine",
        cited_by_count: 512,
        est_if: 82.9,
        pubdate: "2024",
        authors: "Barnes PJ, Stockley RA, et al.",
        institution: "National Heart and Lung Institute",
        summary: "Identified novel epithelial cell subsets directly linked to disease progression.",
        doi: "https://doi.org/10.1038/s41591-023-02688-w"
    },
    {
        title: "Mechanisms of corticosteroid resistance in severe asthma and COPD",
        journal: "The Lancet Respiratory Medicine",
        cited_by_count: 180,
        est_if: 28.7,
        pubdate: "2022",
        authors: "Adcock IM, Chung KF, et al.",
        institution: "Royal Brompton Hospital",
        summary: "Highlighted histone deacetylase-2 suppression as a primary driver of steroid insensitivity.",
        doi: "https://doi.org/10.1016/S2213-2600(22)00100-1"
    }
];

function toggleAdvancedOptions() {
    const adv = document.getElementById('advancedOptions');
    const txt = document.getElementById('advancedToggleText');
    if (adv.classList.contains('show')) {
        adv.classList.remove('show');
        txt.innerText = 'Show Advanced Filters';
    } else {
        adv.classList.add('show');
        txt.innerText = 'Hide Advanced Filters';
    }
}

function setPaperType(type) {
    selectedPaperType = type;
    document.getElementById('typeAll').classList.toggle('active', type === 'all');
    document.getElementById('typeResearch').classList.toggle('active', type === 'research');
    document.getElementById('typeReview').classList.toggle('active', type === 'review');
    fetchArticles();
}

function setIFThreshold(minIF) {
    currentIFThreshold = minIF;
    [0, 5, 10, 20].forEach(val => {
        const tabBtn = document.getElementById(`tab-${val}`);
        if (tabBtn) tabBtn.classList.toggle('active', val === minIF);
    });
    fetchArticles();
}

function showSkeletons(containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton-line" style="width: 80%;"></div>
            <div class="skeleton-line" style="width: 40%;"></div>
            <div class="skeleton-line" style="width: 60%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
        </div>
    `).join('');
}

function getAbstractFromInvertedIndex(invertedIndex) {
    if (!invertedIndex) return '';
    try {
        let maxPos = -1;
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                if (pos > maxPos) maxPos = pos;
            }
        }
        if (maxPos === -1) return '';
        let words = new Array(maxPos + 1);
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                words[pos] = word;
            }
        }
        return words.join(' ');
    } catch (e) {
        return '';
    }
}

function extractTakeaway(abstractText) {
    if (!abstractText || abstractText.trim().length === 0) {
        return "Summary unavailable for this paper.";
    }
    const sentences = abstractText.trim().split(/(?<=[.!?])\s+(?=[A-Z])/);
    if (sentences.length === 0) return abstractText;

    const conclusionTriggers = ["conclude", "demonstrate", "show", "suggest", "found that", "results indicate"];
    for (let sentence of sentences) {
        if (conclusionTriggers.some(t => sentence.toLowerCase().includes(t))) {
            return sentence;
        }
    }
    return sentences[sentences.length - 1] || sentences[0];
}

// Fetch helper with 4-second timeout
async function fetchWithTimeout(resource, timeout = 4000) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
        const response = await fetch(resource, { signal: controller.signal });
        clearTimeout(id);
        return response;
    } catch (err) {
        clearTimeout(id);
        throw err;
    }
}

async function fetchArticles() {
    const statusDiv = document.getElementById('statusMessage');
    const resultsDiv = document.getElementById('articlesContainer');
    const limit = parseInt(document.getElementById('limitInput').value.trim(), 10) || 10;

    const topic   = document.getElementById('topicInput').value.trim();
    const title   = document.getElementById('titleInput').value.trim();
    const journal = document.getElementById('journalInput').value.trim();
    const author  = document.getElementById('authorInput').value.trim();

    showSkeletons('articlesContainer');
    statusDiv.innerText = `Connecting to research database...`;

    let searchQuery = topic || title || "respiratory disease";
    let apiUrl = `https://api.openalex.org/works?per_page=25&search=${encodeURIComponent(searchQuery)}`;

    if (selectedPaperType === 'review') apiUrl += `&filter=type:review`;
    if (selectedPaperType === 'research') apiUrl += `&filter=type:article`;

    try {
        const response = await fetchWithTimeout(apiUrl, 4000);
        if (!response.ok) throw new Error(`HTTP Error ${response.status}`);
        
        const data = await response.json();
        let works = data.results || [];

        // Impact factor tab filter
        if (currentIFThreshold > 0) {
            works = works.filter(w => (w.primary_location?.source?.2yr_cited_by_count || 0) >= currentIFThreshold);
        }

        works = works.slice(0, limit);

        if (works.length === 0) {
            statusDiv.innerText = `No live articles matched Impact Factor > ${currentIFThreshold}. Try lowering the tab selection.`;
            resultsDiv.innerHTML = "";
            return;
        }

        statusDiv.innerText = `Displaying ${works.length} articles from OpenAlex API (Impact Factor > ${currentIFThreshold}):`;
        renderWorks(works, resultsDiv);

    } catch (error) {
        console.warn("Live API fetch timed out or was blocked. Displaying offline dataset.", error);
        statusDiv.innerText = `Live API unreachable (network/firewall). Displaying offline sample dataset:`;
        renderOfflineData(resultsDiv);
    }
}

function renderWorks(works, container) {
    container.innerHTML = "";
    const svgIcon = `<svg class="external-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;

    works.forEach(work => {
        const titleStr = work.display_name || "Untitled Paper";
        const citations = work.cited_by_count || 0;
        const journalName = work.primary_location?.source?.display_name || 'N/A';
        const estIF = work.primary_location?.source?.2yr_cited_by_count || 0;
        const url = work.doi || work.id || "#";

        const abstractText = getAbstractFromInvertedIndex(work.abstract_inverted_index);
        const summaryStr = extractTakeaway(abstractText);

        const authors = work.authorships?.map(a => a.author?.display_name).filter(Boolean).slice(0, 4).join(', ') || 'Unknown Authors';
        const inst = work.authorships?.[0]?.institutions?.[0]?.display_name || 'N/A';

        const card = document.createElement('div');
        card.className = 'article-card';
        card.innerHTML = `
            <div class="article-title-row">
                <h3 class="article-title"><a href="${url}" target="_blank" rel="noopener"><span>${titleStr}</span> ${svgIcon}</a></h3>
            </div>
            <div class="badge-row">
                <span class="badge if-badge">Est. IF: ${estIF.toFixed(1)}</span>
                <span class="badge citation">${citations.toLocaleString()} citations</span>
                <span class="badge">${journalName}</span>
            </div>
            <div class="authors"><strong>Authors:</strong> ${authors}</div>
            <div class="institution"><strong>Institution:</strong> ${inst}</div>
            <div class="paper-summary"><strong>Summary:</strong> ${summaryStr}</div>
        `;
        container.appendChild(card);
    });
}

function renderOfflineData(container) {
    container.innerHTML = "";
    const svgIcon = `<svg class="external-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;

    let items = FALLBACK_ARTICLES;
    if (currentIFThreshold > 0) {
        items = items.filter(i => i.est_if >= currentIFThreshold);
    }

    items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'article-card';
        card.innerHTML = `
            <div class="article-title-row">
                <h3 class="article-title"><a href="${item.doi}" target="_blank" rel="noopener"><span>${item.title}</span> ${svgIcon}</a></h3>
            </div>
            <div class="badge-row">
                <span class="badge if-badge">Est. IF: ${item.est_if}</span>
                <span class="badge citation">${item.cited_by_count} citations</span>
                <span class="badge">${item.journal}</span>
                <span class="badge">${item.pubdate}</span>
            </div>
            <div class="authors"><strong>Authors:</strong> ${item.authors}</div>
            <div class="institution"><strong>Institution:</strong> ${item.institution}</div>
            <div class="paper-summary"><strong>Summary:</strong> ${item.summary}</div>
        `;
        container.appendChild(card);
    });
}

document.addEventListener("DOMContentLoaded", () => {
    const inputs = document.querySelectorAll('input[type="text"]');
    inputs.forEach(input => {
        input.addEventListener("keyup", (e) => { if (e.key === "Enter") fetchArticles(); });
    });
    fetchArticles();
});
</script>
</body>
</html>
