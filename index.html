<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiratory Research Dashboard</title>

    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/microscope.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary-slate: #0f172a;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --indigo-accent: #6366f1;
            --indigo-light: #eef2ff;
            --summary-bg: #faf5ff;
            --summary-border: #8b5cf6;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 32px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 24px;
            text-align: left;
        }

        header .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-light);
            color: var(--accent-blue);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary-slate);
            margin: 0 0 6px 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        /* Journal Grid Styles */
        .journal-section {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            padding: 20px;
            margin-bottom: 24px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        .journal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 10px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .journal-grid::-webkit-scrollbar {
            width: 6px;
        }
        .journal-grid::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .journal-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: inherit;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dark);
            text-align: left;
            transition: all 0.2s ease;
        }

        .journal-btn:hover {
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: var(--shadow-sm);
        }

        .journal-btn.active {
            background: var(--accent-light);
            border-color: var(--accent-blue);
            color: var(--accent-blue);
            font-weight: 700;
        }

        .journal-icon {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            object-fit: contain;
            background: #fff;
            flex-shrink: 0;
        }

        .journal-btn.all-btn .journal-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--accent-blue);
            color: white;
            font-size: 11px;
            font-weight: 700;
        }

        .search-container {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 20px;
            margin-bottom: 24px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group.full-width { grid-column: span 2; }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        input[type="text"], select {
            padding: 10px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c64748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .toggle-group {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background-color: #ffffff;
            color: var(--accent-blue);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        .controls-bar {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 20px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .controls-bar .input-group { flex: 1; }

        .btn-submit {
            padding: 10px 24px;
            font-size: 14px;
            font-family: inherit;
            background-color: var(--primary-slate);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;

        }

        .btn-submit:hover {
            background-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }

        .article-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .article-title {
            font-size: 18px;
            margin: 0;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .article-title a {
            color: var(--text-dark);
            text-decoration: none;
            display: inline-flex;
            align-items: flex-start;
            gap: 6px;
        }

        .article-title a:hover { color: var(--accent-blue); }

        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .badge.citation {
            background-color: var(--accent-light);
            color: var(--accent-blue);
            font-weight: 700;
        }

        .badge.journal {
            background-color: var(--indigo-light);
            color: var(--indigo-accent);
        }

        .external-icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.2;
            fill: none;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .authors { font-size: 13px; color: var(--text-dark); margin-bottom: 6px; }
        .institution { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }

        .paper-summary {
            font-size: 13px;
            line-height: 1.6;
            color: #334155;
            background-color: var(--summary-bg);
            padding: 12px 16px;
            border-left: 3px solid var(--summary-border);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-top: 12px;
        }

        .paper-summary strong { color: #6d28d9; display: inline-block; margin-bottom: 2px; }
        .status-msg { font-weight: 600; margin-bottom: 16px; color: var(--text-muted); font-size: 14px; }

        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            margin-bottom: 18px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 640px) {
            body { padding: 16px 12px; }
            .search-grid, .controls-bar { grid-template-columns: 1fr; flex-direction: column; }
            .input-group.full-width { grid-column: span 1; }
            .journal-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-badge">🫁 Respiratory Research Engine</div>
        <h1>Respiratory Literature Intelligence</h1>
        <p class="subtitle">Explore high-impact journals across respiratory medicine and critical care.</p>
    </header>

    <!-- Top 20 Respiratory Journals Grid -->
    <div class="journal-section">
        <div class="section-header">
            <span class="section-title">Top 20 Respiratory Journals</span>
            <span id="activeJournalLabel" style="font-size: 12px; color: var(--accent-blue); font-weight: 600;">Filter: All Journals</span>
        </div>
        <div class="journal-grid" id="journalGrid">
            <!-- Dynamic Journal Buttons rendered by JS -->
        </div>
    </div>

    <div class="search-container">
        <div class="search-grid">
            <div class="input-group full-width">
                <label for="topicInput">Topic / Keywords</label>
                <input type="text" id="topicInput" placeholder="e.g. COPD, IL-33, Asthma, COVID-19" value="COPD">
            </div>

            <div class="input-group full-width">
                <label>Paper Type</label>
                <div class="toggle-group">
                    <button type="button" id="typeAll" class="toggle-btn active" onclick="setPaperType('all')">All Types</button>
                    <button type="button" id="typeResearch" class="toggle-btn" onclick="setPaperType('research')">Research Papers</button>
                    <button type="button" id="typeReview" class="toggle-btn" onclick="setPaperType('review')">Review Papers</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Feed Controls Bar -->
    <div class="controls-bar">
        <div class="input-group">
            <label for="sortSelect">Sort / Feed Type</label>
            <select id="sortSelect" onchange="fetchArticles()">
                <option value="recent" selected>⚡ Most Recent</option>
                <option value="cited2Y">🔥 Top Cited (2 Years)</option>
                <option value="citedAll">🏆 Top Cited (All Time)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="limitInput">Results Limit</label>
            <select id="limitInput" onchange="fetchArticles()">
                <option value="10" selected>10 Articles</option>
                <option value="20">20 Articles</option>
                <option value="30">30 Articles</option>
            </select>
        </div>

        <button class="btn-submit" onclick="fetchArticles()">Search</button>
    </div>

    <div id="feedContent">
        <div id="statusMsg" class="status-msg"></div>
        <div id="resultsContainer"></div>
    </div>
</div>

<script>
// Top 20 Respiratory Journals List
const RESPIRATORY_JOURNALS = [
    { name: "The Lancet Respiratory Medicine", domain: "thelancet.com" },
    { name: "American Journal of Respiratory and Critical Care Medicine", domain: "atsjournals.org" },
    { name: "European Respiratory Journal", domain: "ersjournals.com" },
    { name: "Chest", domain: "chestnet.org" },
    { name: "Thorax", domain: "bmj.com" },
    { name: "Respirology", domain: "wiley.com" },
    { name: "Annals of the American Thoracic Society", domain: "atsjournals.org" },
    { name: "European Respiratory Review", domain: "ersjournals.com" },
    { name: "Respiratory Research", domain: "biomedcentral.com" },
    { name: "Respiratory Medicine", domain: "elsevier.com" },
    { name: "Journal of Heart and Lung Transplantation", domain: "jhltonline.org" },
    { name: "Pulmonology", domain: "elsevier.com" },
    { name: "Critical Care Medicine", domain: "lww.com" },
    { name: "Critical Care", domain: "biomedcentral.com" },
    { name: "Lancet Critical Care", domain: "thelancet.com" },
    { name: "Journal of Cystic Fibrosis", domain: "elsevier.com" },
    { name: "BMC Pulmonary Medicine", domain: "biomedcentral.com" },
    { name: "International Journal of Chronic Obstructive Pulmonary Disease", domain: "dovepress.com" },
    { name: "Frontiers in Medicine", domain: "frontiersin.org" },
    { name: "Lung", domain: "springer.com" }
];

let selectedJournal = "";
let selectedPaperType = 'all';

function renderJournalButtons() {
    const grid = document.getElementById('journalGrid');
    
    // "All Journals" button
    let html = `
        <button class="journal-btn all-btn ${selectedJournal === '' ? 'active' : ''}" onclick="selectJournal('')">
            <div class="journal-icon">ALL</div>
            <span>All Respiratory Journals</span>
        </button>
    `;

    RESPIRATORY_JOURNALS.forEach(j => {
        const logoUrl = `https://logo.clearbit.com/${j.domain}`;
        const isSelected = selectedJournal === j.name;
        html += `
            <button class="journal-btn ${isSelected ? 'active' : ''}" onclick="selectJournal('${j.name.replace(/'/g, "\\'")}')">
                <img class="journal-icon" src="${logoUrl}" onerror="this.src='https://img.icons8.com/color/48/journal.png'" alt="logo">
                <span>${j.name}</span>
            </button>
        `;
    });

    grid.innerHTML = html;
}

function selectJournal(journalName) {
    selectedJournal = journalName;
    document.getElementById('activeJournalLabel').innerText = journalName ? `Filter: ${journalName}` : "Filter: All Journals";
    renderJournalButtons();
    fetchArticles();
}

function setPaperType(type) {
    selectedPaperType = type;
    document.getElementById('typeAll').classList.toggle('active', type === 'all');
    document.getElementById('typeResearch').classList.toggle('active', type === 'research');
    document.getElementById('typeReview').classList.toggle('active', type === 'review');
    fetchArticles();
}

function showSkeletons() {
    const container = document.getElementById('resultsContainer');
    container.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton-line" style="width: 75%;"></div>
            <div class="skeleton-line" style="width: 35%;"></div>
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
        </div>
    `).join('');
}

function formatCleanDate(paper) {
    let rawDate = paper.pubdate || paper.sortfirstdate || paper.publication_date || "";
    if (!rawDate) return "N/A";

    const parts = rawDate.replace(/\//g, " ").replace(/-/g, " ").trim().split(/\s+/);
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    let year = parts.find(p => /^\d{4}$/.test(p));
    let month = parts.find(p => months.some(m => p.toLowerCase().startsWith(m.toLowerCase())));

    if (month && year) {
        const formattedMonth = month.charAt(0).toUpperCase() + month.slice(1, 3).toLowerCase();
        return `${formattedMonth} ${year}`;
    } else if (year) {
        return year;
    }
    return rawDate; 
}

function getAbstractFromInvertedIndex(invertedIndex) {
    if (!invertedIndex) return '';
    try {
        let maxPos = -1;
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                if (pos > maxPos) maxPos = pos;
            }
        }
        if (maxPos === -1) return '';
        let words = new Array(maxPos + 1);
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                words[pos] = word;
            }
        }
        return words.join(' ');
    } catch (e) {
        return '';
    }
}

function extractTakeaway(abstractText) {
    if (!abstractText || abstractText.trim().length === 0) {
        return "Summary unavailable for this paper.";
    }

    const cleanText = abstractText.trim();
    const sentences = cleanText
        .split(/(?<=[.!?])\s+(?=[A-Z])/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

    if (sentences.length === 0) return cleanText;

    const conclusionTriggers = [
        "conclude that", "demonstrate that", "demonstrated that", "show that", 
        "showed that", "suggest that", "suggests that", "found that", 
        "results indicate", "results show", "findings indicate", "in conclusion", 
        "overall,", "taken together", "we identified", "our data suggest"
    ];

    for (let sentence of sentences) {
        const lower = sentence.toLowerCase();
        if (conclusionTriggers.some(trigger => lower.includes(trigger))) {
            return sentence;
        }
    }

    if (sentences.length > 1) {
        const lastSentence = sentences[sentences.length - 1];
        if (lastSentence.length > 25) {
            return lastSentence;
        }
    }

    return sentences[0];
}

async function fetchArticles() {
    const limit = parseInt(document.getElementById('limitInput').value, 10) || 10;
    const sortVal = document.getElementById('sortSelect').value;

    const statusDiv = document.getElementById('statusMsg');
    const resultsDiv = document.getElementById('resultsContainer');
    const topic = document.getElementById('topicInput').value.trim();

    showSkeletons();
    statusDiv.innerText = "Fetching articles...";

    let filters = [];

    if (topic) {
        const queryTopic = topic.startsWith('"') ? topic : `"${topic}"`;
        filters.push(`title_and_abstract.search:${encodeURIComponent(queryTopic)}`);
    }

    if (selectedJournal) {
        filters.push(`primary_location.source.display_name.search:${encodeURIComponent(selectedJournal)}`);
    }

    if (sortVal === 'cited2Y') {
        const currentYear = new Date().getFullYear();
        filters.push(`publication_year:${currentYear - 2}-${currentYear}`);
    }

    if (selectedPaperType === 'review') {
        filters.push(`type:review`);
    } else if (selectedPaperType === 'research') {
        filters.push(`type:article`);
    }

    let sortParam = "publication_date:desc";
    if (sortVal === 'cited2Y' || sortVal === 'citedAll') {
        sortParam = "cited_by_count:desc";
    }

    const apiUrl = `https://api.openalex.org/works?filter=${filters.join(',')}&sort=${sortParam}&per_page=${limit}`;

    try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        const data = await res.json();
        let works = data.results || [];

        if (works.length === 0) {
            statusDiv.innerText = "No articles found matching your criteria.";
            resultsDiv.innerHTML = "";
            return;
        }

        statusDiv.innerText = `Displaying ${works.length} articles:`;
        resultsDiv.innerHTML = "";
        const externalIconSvg = `<svg class="external-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;

        works.forEach(work => {
            const titleStr = work.display_name || "Untitled Paper";
            const citations = work.cited_by_count || 0;
            const cleanDate = formatCleanDate(work);
            const journalName = work.primary_location?.source?.display_name || 'N/A';
            const url = work.doi || work.ids?.doi || work.id || "#";

            const abstractText = getAbstractFromInvertedIndex(work.abstract_inverted_index);
            const summaryStr = extractTakeaway(abstractText);

            let authorList = 'Unknown Authors';
            let firstInstitution = 'N/A';

            if (work.authorships && work.authorships.length > 0) {
                const names = work.authorships.map(a => a.author?.display_name).filter(Boolean);
                authorList = names.slice(0, 5).join(', ') + (names.length > 5 ? ' et al.' : '');

                const firstAuthorship = work.authorships[0];
                if (firstAuthorship?.institutions && firstAuthorship.institutions.length > 0) {
                    firstInstitution = firstAuthorship.institutions.map(inst => inst.display_name).join(', ');
                } else if (firstAuthorship?.raw_affiliation_strings && firstAuthorship.raw_affiliation_strings.length > 0) {
                    firstInstitution = firstAuthorship.raw_affiliation_strings[0];
                }
            }

            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <div class="article-title-row">
                    <h3 class="article-title">
                        <a href="${url}" target="_blank" rel="noopener">
                            <span>${titleStr}</span>
                            ${externalIconSvg}
                        </a>
                    </h3>
                </div>
                <div class="badge-row">
                    <span class="badge citation">📌 ${citations.toLocaleString()} ${citations === 1 ? 'citation' : 'citations'}</span>
                    <span class="badge journal">📖 ${journalName}</span>
                    <span class="badge">📅 ${cleanDate}</span>
                </div>
                <div class="authors">
                    <strong>Authors:</strong> ${authorList}
                </div>
                <div class="institution">
                    <strong>Institution (1st Author):</strong> ${firstInstitution}
                </div>
                <div class="paper-summary">
                    <strong>📝 Takeaway:</strong> ${summaryStr}
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    } catch (e) {
        console.error("OpenAlex Fetch Error:", e);
        statusDiv.innerText = "Unable to load articles.";
        resultsDiv.innerHTML = "";
    }
}

window.addEventListener('DOMContentLoaded', () => {
    renderJournalButtons();
    fetchArticles();
});
</script>
</body>
</html>
