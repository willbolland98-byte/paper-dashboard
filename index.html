<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Article Dashboard</title>

    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/microscope.png">

    <style>
        :root {
            /* Modernized Professional Palette */
            --bg-main: #f1f5f9;
            --bg-card: #ffffff;
            --primary-navy: #0f172a;
            --primary-slate: #1e293b;
            --accent-teal: #0d9488;
            --accent-teal-light: #ccfbf1;
            --accent-blue: #2563eb;
            --accent-blue-light: #eff6ff;
            --summary-indigo: #4f46e5;
            --summary-bg: #f5f3ff;
            --badge-if-bg: #fef3c7;
            --badge-if-text: #b45309;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 32px 16px;
        }

        .container {
            max-width: 880px;
            margin: 0 auto;
        }

        /* Hero Header Styling */
        header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 8px;
        }

        .header-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent-teal), var(--accent-blue));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 4px 10px rgba(13, 148, 136, 0.25);
            flex-shrink: 0;
        }

        .header-icon svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            color: var(--primary-navy);
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.6px;
            line-height: 1.2;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
        }

        /* Search Panel Container */
        .search-container {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px -2px rgba(15, 23, 42, 0.05);
            padding: 24px;
            margin-bottom: 24px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        input[type="text"] {
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background-color: #f8fafc;
            color: var(--text-dark);
            transition: all 0.15s ease;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-teal);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }

        /* Toggle Button Groups */
        .toggle-group {
            display: flex;
            gap: 6px;
        }

        .toggle-btn {
            flex: 1;
            padding: 9px 12px;
            font-size: 13px;
            font-weight: 500;
            background-color: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            color: var(--primary-navy);
            background-color: #e2e8f0;
        }

        .toggle-btn.active {
            background-color: var(--primary-navy);
            color: #ffffff;
            font-weight: 600;
        }

        /* Advanced Options Collapsible */
        .advanced-toggle {
            background: none;
            border: none;
            color: var(--accent-teal);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: color 0.15s;
        }

        .advanced-toggle:hover {
            color: #0f766e;
        }

        .advanced-options {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
        }

        .advanced-options.show {
            display: grid;
        }

        .button-container {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            margin-top: 12px;
        }

        .btn-submit {
            padding: 10px 24px;
            font-size: 14px;
            background-color: var(--accent-teal);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover {
            background-color: #0f766e;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Sticky Tab Bar */
        .sticky-tab-bar {
            position: sticky;
            top: 12px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 6px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
            margin-bottom: 20px;
        }

        /* Article Cards */
        .article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 4px -1px rgba(15, 23, 42, 0.03);
            transition: all 0.2s ease-in-out;
        }

        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -4px rgba(15, 23, 42, 0.08);
            border-color: var(--border-hover);
        }

        .article-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .article-title {
            font-size: 17px;
            margin: 0;
            line-height: 1.4;
            font-weight: 600;
        }

        .article-title a {
            color: var(--primary-navy);
            text-decoration: none;
            display: inline-flex;
            align-items: flex-start;
            gap: 6px;
            transition: color 0.15s;
        }

        .article-title a:hover {
            color: var(--accent-teal);
        }

        /* Pill Badges */
        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 12px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .badge.citation {
            background-color: var(--accent-blue-light);
            color: var(--accent-blue);
            font-weight: 700;
            white-space: nowrap;
        }

        .badge.if-badge {
            background-color: var(--badge-if-bg);
            color: var(--badge-if-text);
            font-weight: 700;
        }

        .external-icon {
            width: 15px;
            height: 15px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .authors {
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .institution {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        /* Summary Callout Box */
        .paper-summary {
            font-size: 13px;
            line-height: 1.55;
            color: #334155;
            background-color: var(--summary-bg);
            padding: 12px 14px;
            border-left: 3px solid var(--summary-indigo);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            margin-top: 10px;
        }

        .paper-summary strong {
            color: #3730a3;
            display: inline-block;
            margin-bottom: 2px;
        }

        .status-msg {
            font-weight: 500;
            margin-bottom: 14px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Skeleton Animated Loading State */
        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 600px) {
            .search-grid, .advanced-options {
                grid-template-columns: 1fr;
            }
            .input-group.full-width, .button-container {
                grid-column: span 1;
            }
            .toggle-group {
                flex-direction: column;
            }
            .article-title-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title-wrapper">
            <div class="header-icon">
                <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
            </div>
            <h1>Research Article Dashboard</h1>
        </div>
        <p class="subtitle">Discover real-time scientific literature filtered by journal citation impact factors.</p>
    </header>

    <!-- Search Controls -->
    <div class="search-container">
        <div class="search-grid">
            <div class="input-group full-width">
                <label for="topicInput">General Topic / Keywords</label>
                <input type="text" id="topicInput" placeholder="e.g. IL-33, B.1.640.1, COPD" value="COPD">
            </div>

            <div class="input-group full-width">
                <label>Paper Type Filter</label>
                <div class="toggle-group">
                    <button type="button" id="typeAll" class="toggle-btn active" onclick="setPaperType('all')">All Types</button>
                    <button type="button" id="typeResearch" class="toggle-btn" onclick="setPaperType('research')">Research Papers</button>
                    <button type="button" id="typeReview" class="toggle-btn" onclick="setPaperType('review')">Review Papers</button>
                </div>
            </div>
        </div>

        <!-- Advanced Filters Toggle -->
        <button type="button" class="advanced-toggle" onclick="toggleAdvancedOptions()">
            <span id="advancedToggleText">⚙️ Show Advanced Filters</span>
        </button>

        <div id="advancedOptions" class="advanced-options">
            <div class="input-group">
                <label for="titleInput">Title Keywords</label>
                <input type="text" id="titleInput" placeholder="e.g. Rhinovirus, Inflammation">
            </div>

            <div class="input-group">
                <label for="journalInput">Journal Name</label>
                <input type="text" id="journalInput" placeholder="e.g. Nature, Thorax">
            </div>

            <div class="input-group">
                <label for="authorInput">Author Name</label>
                <input type="text" id="authorInput" placeholder="e.g. Johnston SL">
            </div>

            <div class="input-group">
                <label for="limitInput">Max Results</label>
                <input type="text" id="limitInput" value="10">
            </div>
        </div>

        <div class="button-container">
            <button class="btn-submit" onclick="fetchArticles()">Fetch Articles</button>
        </div>
    </div>

    <!-- Sticky Tab Navigation Bar (4 Impact Factor Tabs) -->
    <div class="sticky-tab-bar">
        <div class="toggle-group">
            <button type="button" id="tab-0" class="toggle-btn active" onclick="setIFThreshold(0)">🌐 All Journals</button>
            <button type="button" id="tab-5" class="toggle-btn" onclick="setIFThreshold(5)">⚡ IF > 5</button>
            <button type="button" id="tab-10" class="toggle-btn" onclick="setIFThreshold(10)">🔥 IF > 10</button>
            <button type="button" id="tab-20" class="toggle-btn" onclick="setIFThreshold(20)">🏆 IF > 20</button>
        </div>
    </div>

    <!-- Main Results Container -->
    <div>
        <div id="statusMessage" class="status-msg"></div>
        <div id="articlesContainer"></div>
    </div>
</div>

<script>
let selectedPaperType = 'all';
let currentIFThreshold = 0;

function toggleAdvancedOptions() {
    const adv = document.getElementById('advancedOptions');
    const txt = document.getElementById('advancedToggleText');
    if (adv.classList.contains('show')) {
        adv.classList.remove('show');
        txt.innerText = '⚙️ Show Advanced Filters';
    } else {
        adv.classList.add('show');
        txt.innerText = '⚙️ Hide Advanced Filters';
    }
}

function setPaperType(type) {
    selectedPaperType = type;
    document.getElementById('typeAll').classList.toggle('active', type === 'all');
    document.getElementById('typeResearch').classList.toggle('active', type === 'research');
    document.getElementById('typeReview').classList.toggle('active', type === 'review');
    fetchArticles();
}

function setIFThreshold(minIF) {
    currentIFThreshold = minIF;
    [0, 5, 10, 20].forEach(val => {
        const tabBtn = document.getElementById(`tab-${val}`);
        if (tabBtn) tabBtn.classList.toggle('active', val === minIF);
    });
    fetchArticles();
}

function showSkeletons(containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton-line" style="width: 80%;"></div>
            <div class="skeleton-line" style="width: 40%;"></div>
            <div class="skeleton-line" style="width: 60%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
        </div>
    `).join('');
}

function formatCleanDate(paper) {
    let rawDate = paper.pubdate || paper.sortfirstdate || paper.publication_date || "";
    if (!rawDate) return "N/A";

    const parts = rawDate.replace(/\//g, " ").replace(/-/g, " ").trim().split(/\s+/);
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    
    let year = parts.find(p => /^\d{4}$/.test(p));
    let month = parts.find(p => months.some(m => p.toLowerCase().startsWith(m.toLowerCase())));

    if (month && year) {
        const formattedMonth = month.charAt(0).toUpperCase() + month.slice(1, 3).toLowerCase();
        return `${formattedMonth} ${year}`;
    } else if (year) {
        return year;
    }

    return rawDate; 
}

function getAbstractFromInvertedIndex(invertedIndex) {
    if (!invertedIndex) return '';
    try {
        let maxPos = -1;
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                if (pos > maxPos) maxPos = pos;
            }
        }
        if (maxPos === -1) return '';
        let words = new Array(maxPos + 1);
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                words[pos] = word;
            }
        }
        return words.join(' ');
    } catch (e) {
        return '';
    }
}

function extractTakeaway(abstractText) {
    if (!abstractText || abstractText.trim().length === 0) {
        return "Summary unavailable for this paper.";
    }

    const cleanText = abstractText.trim();
    const sentences = cleanText
        .split(/(?<=[.!?])\s+(?=[A-Z])/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

    if (sentences.length === 0) return cleanText;

    const conclusionTriggers = [
        "conclude that", "demonstrate that", "demonstrated that", "show that", 
        "showed that", "suggest that", "suggests that", "found that", 
        "results indicate", "results show", "findings indicate", "in conclusion", 
        "overall,", "taken together", "we identified", "our data suggest"
    ];

    for (let sentence of sentences) {
        const lower = sentence.toLowerCase();
        if (conclusionTriggers.some(trigger => lower.includes(trigger))) {
            return sentence;
        }
    }

    if (sentences.length > 1) {
        const lastSentence = sentences[sentences.length - 1];
        if (lastSentence.length > 25) {
            return lastSentence;
        }
    }

    return sentences[0];
}

async function fetchArticles() {
    const statusDiv = document.getElementById('statusMessage');
    const resultsDiv = document.getElementById('articlesContainer');
    const limit = parseInt(document.getElementById('limitInput').value.trim(), 10) || 10;

    const topic   = document.getElementById('topicInput').value.trim();
    const title   = document.getElementById('titleInput').value.trim();
    const journal = document.getElementById('journalInput').value.trim();
    const author  = document.getElementById('authorInput').value.trim();

    if (!topic && !title && !journal && !author) {
        statusDiv.innerText = "Please fill in at least one search field.";
        resultsDiv.innerHTML = "";
        return;
    }

    showSkeletons('articlesContainer');
    statusDiv.innerText = `Fetching articles with Journal Impact Factor > ${currentIFThreshold}...`;

    let filters = [];
    if (topic) {
        const queryTopic = topic.startsWith('"') ? topic : `"${topic}"`;
        filters.push(`title_and_abstract.search:${encodeURIComponent(queryTopic)}`);
    }
    if (title) {
        const queryTitle = title.startsWith('"') ? title : `"${title}"`;
        filters.push(`title.search:${encodeURIComponent(queryTitle)}`);
    }
    if (journal) filters.push(`primary_location.source.display_name.search:${encodeURIComponent(journal)}`);
    if (author) filters.push(`author.displayName.search:${encodeURIComponent(author)}`);

    if (selectedPaperType === 'review') {
        filters.push(`type:review`);
    } else if (selectedPaperType === 'research') {
        filters.push(`type:article`);
    }

    if (currentIFThreshold > 0) {
        filters.push(`primary_location.source.2yr_cited_by_count:>${currentIFThreshold}`);
    }

    const fetchLimit = Math.max(limit * 3, 30);
    const apiUrl = `https://api.openalex.org/works?filter=${filters.join(',')}&sort=cited_by_count:desc&per_page=${fetchLimit}`;

    try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        const data = await res.json();
        let works = data.results || [];

        if (topic) {
            const cleanTopic = topic.replace(/"/g, '').toLowerCase();
            works = works.filter(work => {
                const titleText = (work.display_name || "").toLowerCase();
                const abstractText = getAbstractFromInvertedIndex(work.abstract_inverted_index).toLowerCase();
                return titleText.includes(cleanTopic) || abstractText.includes(cleanTopic);
            });
        }

        if (currentIFThreshold > 0) {
            works = works.filter(work => {
                const estIF = work.primary_location?.source?.2yr_cited_by_count || 0;
                return estIF >= currentIFThreshold;
            });
        }

        works = works.slice(0, limit);

        if (works.length === 0) {
            statusDiv.innerText = `No articles found matching Impact Factor > ${currentIFThreshold}.`;
            resultsDiv.innerHTML = "";
            return;
        }

        statusDiv.innerText = `Displaying ${works.length} articles matching Impact Factor > ${currentIFThreshold}:`;
        resultsDiv.innerHTML = "";
        const externalIconSvg = `<svg class="external-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;

        works.forEach(work => {
            const titleStr = work.display_name || "Untitled Paper";
            const citations = work.cited_by_count || 0;
            const cleanDate = formatCleanDate(work);
            const journalName = work.primary_location?.source?.display_name || 'N/A';
            const estIF = work.primary_location?.source?.2yr_cited_by_count || null;
            const url = work.doi || work.ids?.doi || work.id || "#";

            const abstractText = getAbstractFromInvertedIndex(work.abstract_inverted_index);
            const summaryStr = extractTakeaway(abstractText);

            let authorList = 'Unknown Authors';
            let firstInstitution = 'N/A';

            if (work.authorships && work.authorships.length > 0) {
                const names = work.authorships.map(a => a.author?.display_name).filter(Boolean);
                authorList = names.slice(0, 5).join(', ') + (names.length > 5 ? ' et al.' : '');

                const firstAuthorship = work.authorships[0];
                if (firstAuthorship?.institutions && firstAuthorship.institutions.length > 0) {
                    firstInstitution = firstAuthorship.institutions.map(inst => inst.display_name).join(', ');
                } else if (firstAuthorship?.raw_affiliation_strings && firstAuthorship.raw_affiliation_strings.length > 0) {
                    firstInstitution = firstAuthorship.raw_affiliation_strings[0];
                }
            }

            const ifBadgeText = estIF !== null ? `⭐ Est. IF: ${estIF.toFixed(1)}` : '⭐ Est. IF: N/A';

            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <div class="article-title-row">
                    <h3 class="article-title">
                        <a href="${url}" target="_blank" rel="noopener">
                            <span>${titleStr}</span>
                            ${externalIconSvg}
                        </a>
                    </h3>
                </div>
                <div class="badge-row">
                    <span class="badge if-badge">${ifBadgeText}</span>
                    <span class="badge citation">📌 ${citations.toLocaleString()} ${citations === 1 ? 'citation' : 'citations'}</span>
                    <span class="badge">📖 ${journalName}</span>
                    <span class="badge">📅 ${cleanDate}</span>
                </div>
                <div class="authors">
                    <strong>Authors:</strong> ${authorList}
                </div>
                <div class="institution">
                    <strong>Institution (1st Author):</strong> ${firstInstitution}
                </div>
                <div class="paper-summary">
                    <strong>📝 Summary:</strong> ${summaryStr}
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    } catch (e) {
        console.error("Fetch Error:", e);
        statusDiv.innerText = "Unable to load papers.";
        resultsDiv.innerHTML = "";
    }
}

// Automatically fetch default results on load
document.addEventListener("DOMContentLoaded", () => {
    fetchArticles();
});
</script>
</body>
</html>
