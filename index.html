<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiratory Literature Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary-slate: #0f172a;
            --accent-blue: #2563eb;
            --accent-light: #eff6ff;
            --indigo-accent: #6366f1;
            --indigo-light: #eef2ff;
            --summary-bg: #faf5ff;
            --summary-border: #8b5cf6;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 32px 16px;
            line-height: 1.5;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header { margin-bottom: 24px; }
        header .header-badge {
            display: inline-flex;
            align-items: center;
            background: var(--accent-light);
            color: var(--accent-blue);
            font-size: 11px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        h1 { color: var(--primary-slate); margin: 0 0 6px 0; font-size: 28px; font-weight: 700; }
        .subtitle { color: var(--text-muted); margin: 0; font-size: 14px; }

        .search-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 20px;
            margin-bottom: 20px;
        }

        .search-input-wrapper {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .search-input-wrapper input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background: #f8fafc;
        }

        .search-input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .btn-search {
            padding: 12px 24px;
            background: var(--primary-slate);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-search:hover { background: var(--accent-blue); }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .chip-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-right: 4px; }

        .chip {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            background: #f1f5f9;
            color: var(--text-muted);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip:hover { color: var(--text-dark); background: #e2e8f0; }
        .chip.active { background: var(--accent-light); color: var(--accent-blue); border-color: var(--accent-blue); }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border-color);
        }

        select {
            padding: 8px 12px;
            font-size: 13px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            color: var(--text-dark);
            cursor: pointer;
        }

        .article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
        }

        .article-title { font-size: 17px; margin: 0 0 10px 0; font-weight: 700; }
        .article-title a { color: var(--text-dark); text-decoration: none; }
        .article-title a:hover { color: var(--accent-blue); }

        .badge-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; background: #f1f5f9; color: var(--text-muted); }
        .badge.citation { background: var(--accent-light); color: var(--accent-blue); }
        .badge.journal { background: var(--indigo-light); color: var(--indigo-accent); }

        .authors { font-size: 13px; margin-bottom: 4px; }
        .institution { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }

        .paper-summary {
            font-size: 13px;
            line-height: 1.5;
            background: var(--summary-bg);
            padding: 10px 14px;
            border-left: 3px solid var(--summary-border);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
        }

        .status-msg { font-weight: 600; margin-bottom: 16px; color: var(--text-muted); font-size: 14px; }

        .skeleton-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-xl); padding: 20px; margin-bottom: 16px; }
        .skeleton-line { height: 14px; background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 200% 100%; animation: skeleton-loading 1.5s infinite; border-radius: 4px; margin-bottom: 10px; }
        @keyframes skeleton-loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        @media (max-width: 640px) { .filter-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-badge">Respiratory Engine</div>
        <h1>Respiratory Literature Intelligence</h1>
        <p class="subtitle">Real-time search across scientific literature.</p>
    </header>

    <div class="search-card">
        <div class="search-input-wrapper">
            <input type="text" id="searchInput" placeholder="Search topics, keywords, or titles (e.g., COPD, IL-33, Asthma)..." value="COPD">
            <button class="btn-search" onclick="fetchArticles()">Search</button>
        </div>

        <div class="filter-chips">
            <span class="chip-label">Type:</span>
            <button class="chip active" id="chipAll" onclick="setPaperType('all')">All</button>
            <button class="chip" id="chipResearch" onclick="setPaperType('research')">Research</button>
            <button class="chip" id="chipReview" onclick="setPaperType('review')">Reviews</button>
        </div>

        <div class="filter-row">
            <div>
                <select id="sortSelect" onchange="fetchArticles()" style="width: 100%;">
                    <option value="recent" selected>Most Recent</option>
                    <option value="cited2Y">Top Cited (2 Years)</option>
                    <option value="citedAll">Top Cited (All Time)</option>
                </select>
            </div>

            <div>
                <select id="limitSelect" onchange="fetchArticles()" style="width: 100%;">
                    <option value="10" selected>10 Results</option>
                    <option value="20">20 Results</option>
                    <option value="30">30 Results</option>
                </select>
            </div>
        </div>
    </div>

    <div id="statusMsg" class="status-msg"></div>
    <div id="resultsContainer"></div>
</div>

<script>
let selectedPaperType = 'all';

function setPaperType(type) {
    selectedPaperType = type;
    document.getElementById('chipAll').classList.toggle('active', type === 'all');
    document.getElementById('chipResearch').classList.toggle('active', type === 'research');
    document.getElementById('chipReview').classList.toggle('active', type === 'review');
    fetchArticles();
}

function getTodayDateString() {
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
}

function showSkeletons() {
    const container = document.getElementById('resultsContainer');
    container.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton-line" style="width: 70%;"></div>
            <div class="skeleton-line" style="width: 30%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
        </div>
    `).join('');
}

function getAbstractFromInvertedIndex(invertedIndex) {
    if (!invertedIndex) return '';
    try {
        let maxPos = -1;
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                if (pos > maxPos) maxPos = pos;
            }
        }
        if (maxPos === -1) return '';
        let words = new Array(maxPos + 1);
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                words[pos] = word;
            }
        }
        return words.join(' ');
    } catch (e) {
        return '';
    }
}

function extractTakeaway(abstractText) {
    if (!abstractText || !abstractText.trim()) return "Summary unavailable for this paper.";
    const sentences = abstractText.trim().split(/(?<=[.!?])\s+(?=[A-Z])/);
    return sentences[sentences.length - 1] || sentences[0];
}

async function fetchArticles() {
    const limit = parseInt(document.getElementById('limitSelect').value, 10);
    const sortVal = document.getElementById('sortSelect').value;
    const query = document.getElementById('searchInput').value.trim();

    const statusDiv = document.getElementById('statusMsg');
    const resultsDiv = document.getElementById('resultsContainer');

    showSkeletons();
    statusDiv.innerText = "Searching articles...";

    const todayStr = getTodayDateString();
    let filters = [];

    // Floor the date to today to prevent pre-prints dated in the future
    filters.push(`publication_date:..${todayStr}`);

    if (query) {
        filters.push(`title_and_abstract.search:${encodeURIComponent(query)}`);
    }

    if (selectedPaperType === 'review') {
        filters.push(`type:review`);
    } else if (selectedPaperType === 'research') {
        filters.push(`type:article`);
    }

    let sortParam = "publication_date:desc";
    if (sortVal === 'cited2Y' || sortVal === 'citedAll') {
        sortParam = "cited_by_count:desc";
    }

    if (sortVal === 'cited2Y') {
        const currentYear = new Date().getFullYear();
        filters.push(`publication_year:${currentYear - 2}-${currentYear}`);
    }

    const apiUrl = `https://api.openalex.org/works?filter=${filters.join(',')}&sort=${sortParam}&per_page=${limit}`;

    try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        const data = await res.json();
        const works = data.results || [];

        if (works.length === 0) {
            statusDiv.innerText = "No articles found matching your query.";
            resultsDiv.innerHTML = "";
            return;
        }

        statusDiv.innerText = `Displaying ${works.length} articles (up to ${todayStr}):`;
        resultsDiv.innerHTML = "";

        works.forEach(work => {
            const titleStr = work.display_name || "Untitled Paper";
            const citations = work.cited_by_count || 0;
            const pubDate = work.publication_date || "N/A";
            const journalName = work.primary_location?.source?.display_name || 'N/A';
            const url = work.doi || work.ids?.doi || work.id || "#";

            const abstractText = getAbstractFromInvertedIndex(work.abstract_inverted_index);
            const summaryStr = extractTakeaway(abstractText);

            let authorList = 'Unknown Authors';
            if (work.authorships?.length > 0) {
                const names = work.authorships.map(a => a.author?.display_name).filter(Boolean);
                authorList = names.slice(0, 4).join(', ') + (names.length > 4 ? ' et al.' : '');
            }

            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <h3 class="article-title"><a href="${url}" target="_blank" rel="noopener">${titleStr}</a></h3>
                <div class="badge-row">
                    <span class="badge citation">${citations.toLocaleString()} citations</span>
                    <span class="badge journal">${journalName}</span>
                    <span class="badge">${pubDate}</span>
                </div>
                <div class="authors"><strong>Authors:</strong> ${authorList}</div>
                <div class="paper-summary"><strong>Takeaway:</strong> ${summaryStr}</div>
            `;
            resultsDiv.appendChild(card);
        });
    } catch (e) {
        console.error(e);
        statusDiv.innerText = "Failed to load articles.";
        resultsDiv.innerHTML = "";
    }
}

document.getElementById('searchInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') fetchArticles();
});

window.addEventListener('DOMContentLoaded', fetchArticles);
</script>
</body>
</html>
