<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Article Dashboard</title>

    <link rel="apple-touch-icon" href="https://img.icons8.com/color/180/microscope.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --primary-slate: #0f172a;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --indigo-accent: #6366f1;
            --indigo-light: #eef2ff;
            --emerald-accent: #059669;
            --emerald-light: #ecfdf5;
            --summary-bg: #faf5ff;
            --summary-border: #8b5cf6;
            --border-color: #e2e8f0;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --radius-xl: 16px;
            --radius-lg: 12px;
            --radius-md: 8px;
            --radius-sm: 6px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0;
            padding: 32px 16px;
            line-height: 1.5;
        }

        .container {
            max-width: 920px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 28px;
            text-align: left;
        }

        header .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--accent-light);
            color: var(--accent-blue);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
        }

        h1 {
            color: var(--primary-slate);
            margin: 0 0 6px 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -0.8px;
        }

        .subtitle {
            color: var(--text-muted);
            margin: 0;
            font-size: 15px;
        }

        .search-container {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            padding: 24px;
            margin-bottom: 28px;
            transition: box-shadow 0.2s ease;
        }

        .search-container:focus-within {
            box-shadow: var(--shadow-lg);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        input[type="text"], select {
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            background-color: #f8fafc;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c64748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: var(--accent-blue);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }

        .toggle-group {
            display: flex;
            background: #f1f5f9;
            padding: 4px;
            border-radius: var(--radius-md);
            gap: 4px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn:hover {
            color: var(--text-dark);
        }

        .toggle-btn.active {
            background-color: #ffffff;
            color: var(--accent-blue);
            box-shadow: var(--shadow-sm);
            font-weight: 700;
        }

        .controls-bar {
            position: sticky;
            top: 16px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            margin-bottom: 24px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .controls-bar .input-group {
            flex: 1;
        }

        .advanced-toggle {
            background: none;
            border: none;
            color: var(--accent-blue);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-top: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.15s;
        }

        .advanced-toggle:hover {
            color: var(--accent-blue-hover);
        }

        .advanced-options {
            display: none;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px dashed var(--border-color);
        }

        .advanced-options.show {
            display: grid;
        }

        .button-container {
            grid-column: span 2;
            display: flex;
            justify-content: flex-end;
            margin-top: 16px;
        }

        .btn-submit {
            padding: 12px 28px;
            font-size: 14px;
            font-family: inherit;
            background-color: var(--primary-slate);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(15, 23, 42, 0.15);
        }

        .btn-submit:hover {
            background-color: var(--accent-blue);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .article-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .article-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }

        .article-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .article-title {
            font-size: 18px;
            margin: 0;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .article-title a {
            color: var(--text-dark);
            text-decoration: none;
            display: inline-flex;
            align-items: flex-start;
            gap: 6px;
            transition: color 0.15s;
        }

        .article-title a:hover {
            color: var(--accent-blue);
        }

        .badge-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 14px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background-color: #f1f5f9;
            color: var(--text-muted);
        }

        .badge.citation {
            background-color: var(--accent-light);
            color: var(--accent-blue);
            font-weight: 700;
        }

        .badge.impact-factor {
            background-color: var(--emerald-light);
            color: var(--emerald-accent);
            font-weight: 700;
        }

        .badge.journal {
            background-color: var(--indigo-light);
            color: var(--indigo-accent);
        }

        .external-icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
            margin-top: 3px;
        }

        .authors {
            font-size: 13px;
            color: var(--text-dark);
            margin-bottom: 6px;
        }

        .institution {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .paper-summary {
            font-size: 13px;
            line-height: 1.6;
            color: #334155;
            background-color: var(--summary-bg);
            padding: 12px 16px;
            border-left: 3px solid var(--summary-border);
            border-radius: 0 var(--radius-md) var(--radius-md) 0;
            margin-top: 12px;
        }

        .paper-summary strong {
            color: #6d28d9;
            display: inline-block;
            margin-bottom: 2px;
        }

        .status-msg {
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .skeleton-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 22px;
            margin-bottom: 18px;
        }

        .skeleton-line {
            height: 14px;
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
            margin-bottom: 12px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @media (max-width: 640px) {
            body { padding: 16px 12px; }
            .search-grid, .advanced-options, .controls-bar { grid-template-columns: 1fr; flex-direction: column; }
            .input-group.full-width, .button-container { grid-column: span 1; }
            .toggle-group { flex-direction: column; }
            .article-title-row { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-badge">🔬 Live Feed Dashboard</div>
        <h1>Research Article Intelligence</h1>
        <p class="subtitle">Filter and analyze literature by recency, citation impact, and journal rank.</p>
    </header>

    <div class="search-container">
        <div class="search-grid">
            <div class="input-group full-width">
                <label for="topicInput">General Topic / Keywords</label>
                <input type="text" id="topicInput" placeholder="e.g. IL-33, B.1.640.1, COPD" value="COPD">
            </div>

            <div class="input-group full-width">
                <label>Paper Type Filter</label>
                <div class="toggle-group">
                    <button type="button" id="typeAll" class="toggle-btn active" onclick="setPaperType('all')">All Types</button>
                    <button type="button" id="typeResearch" class="toggle-btn" onclick="setPaperType('research')">Research Papers</button>
                    <button type="button" id="typeReview" class="toggle-btn" onclick="setPaperType('review')">Review Papers</button>
                </div>
            </div>
        </div>

        <button type="button" class="advanced-toggle" onclick="toggleAdvancedOptions()">
            <span id="advancedToggleText">⚙️ Show Advanced Filters</span>
        </button>

        <div id="advancedOptions" class="advanced-options">
            <div class="input-group">
                <label for="titleInput">Title Keywords</label>
                <input type="text" id="titleInput" placeholder="e.g. Rhinovirus, Inflammation">
            </div>

            <div class="input-group">
                <label for="journalInput">Journal Name</label>
                <input type="text" id="journalInput" placeholder="e.g. Nature, Thorax">
            </div>

            <div class="input-group">
                <label for="authorInput">Author Name</label>
                <input type="text" id="authorInput" placeholder="e.g. Johnston SL">
            </div>

            <div class="input-group">
                <label for="limitInput">Max Results</label>
                <input type="text" id="limitInput" value="10">
            </div>
        </div>

        <div class="button-container">
            <button class="btn-submit" onclick="fetchArticles()">Fetch Articles</button>
        </div>
    </div>

    <!-- Dual Dropdown Controls -->
    <div class="controls-bar">
        <div class="input-group">
            <label for="sortSelect">Sort / Feed Type</label>
            <select id="sortSelect" onchange="fetchArticles()">
                <option value="recent" selected>⚡ Most Recent</option>
                <option value="cited2Y">🔥 Top Cited (2 Years)</option>
                <option value="citedAll">🏆 Top Cited (All Time)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="ifSelect">Min Journal Impact Factor</label>
            <select id="ifSelect" onchange="fetchArticles()">
                <option value="0" selected>All Impact Factors</option>
                <option value="5">JIF &gt; 5</option>
                <option value="10">JIF &gt; 10</option>
                <option value="20">JIF &gt; 20</option>
            </select>
        </div>
    </div>

    <div id="feedContent">
        <div id="statusMsg" class="status-msg"></div>
        <div id="resultsContainer"></div>
    </div>
</div>

<script>
let selectedPaperType = 'all';

function toggleAdvancedOptions() {
    const adv = document.getElementById('advancedOptions');
    const txt = document.getElementById('advancedToggleText');
    if (adv.classList.contains('show')) {
        adv.classList.remove('show');
        txt.innerText = '⚙️ Show Advanced Filters';
    } else {
        adv.classList.add('show');
        txt.innerText = '⚙️ Hide Advanced Filters';
    }
}

function setPaperType(type) {
    selectedPaperType = type;
    document.getElementById('typeAll').classList.toggle('active', type === 'all');
    document.getElementById('typeResearch').classList.toggle('active', type === 'research');
    document.getElementById('typeReview').classList.toggle('active', type === 'review');
    fetchArticles();
}

function showSkeletons() {
    const container = document.getElementById('resultsContainer');
    container.innerHTML = Array(3).fill(0).map(() => `
        <div class="skeleton-card">
            <div class="skeleton-line" style="width: 75%;"></div>
            <div class="skeleton-line" style="width: 35%;"></div>
            <div class="skeleton-line" style="width: 50%;"></div>
            <div class="skeleton-line" style="width: 100%;"></div>
        </div>
    `).join('');
}

function formatCleanDate(paper) {
    let rawDate = paper.pubdate || paper.sortfirstdate || paper.publication_date || "";
    if (!rawDate) return "N/A";

    const parts = rawDate.replace(/\//g, " ").replace(/-/g, " ").trim().split(/\s+/);
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    let year = parts.find(p => /^\d{4}$/.test(p));
    let month = parts.find(p => months.some(m => p.toLowerCase().startsWith(m.toLowerCase())));

    if (month && year) {
        const formattedMonth = month.charAt(0).toUpperCase() + month.slice(1, 3).toLowerCase();
        return `${formattedMonth} ${year}`;
    } else if (year) {
        return year;
    }

    return rawDate; 
}

function getAbstractFromInvertedIndex(invertedIndex) {
    if (!invertedIndex) return '';
    try {
        let maxPos = -1;
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                if (pos > maxPos) maxPos = pos;
            }
        }
        if (maxPos === -1) return '';
        let words = new Array(maxPos + 1);
        for (let word in invertedIndex) {
            for (let pos of invertedIndex[word]) {
                words[pos] = word;
            }
        }
        return words.join(' ');
    } catch (e) {
        return '';
    }
}

function extractTakeaway(abstractText) {
    if (!abstractText || abstractText.trim().length === 0) {
        return "Summary unavailable for this paper.";
    }

    const cleanText = abstractText.trim();
    const sentences = cleanText
        .split(/(?<=[.!?])\s+(?=[A-Z])/)
        .map(s => s.trim())
        .filter(s => s.length > 0);

    if (sentences.length === 0) return cleanText;

    const conclusionTriggers = [
        "conclude that", "demonstrate that", "demonstrated that", "show that", 
        "showed that", "suggest that", "suggests that", "found that", 
        "results indicate", "results show", "findings indicate", "in conclusion", 
        "overall,", "taken together", "we identified", "our data suggest"
    ];

    for (let sentence of sentences) {
        const lower = sentence.toLowerCase();
        if (conclusionTriggers.some(trigger => lower.includes(trigger))) {
            return sentence;
        }
    }

    if (sentences.length > 1) {
        const lastSentence = sentences[sentences.length - 1];
        if (lastSentence.length > 25) {
            return lastSentence;
        }
    }

    return sentences[0];
}

async function fetchArticles() {
    const limit = parseInt(document.getElementById('limitInput').value.trim(), 10) || 10;
    const sortVal = document.getElementById('sortSelect').value;
    const minIF = parseFloat(document.getElementById('ifSelect').value) || 0;

    const statusDiv = document.getElementById('statusMsg');
    const resultsDiv = document.getElementById('resultsContainer');

    const topic   = document.getElementById('topicInput').value.trim();
    const title   = document.getElementById('titleInput').value.trim();
    const journal = document.getElementById('journalInput').value.trim();
    const author  = document.getElementById('authorInput').value.trim();

    if (!topic && !title && !journal && !author) {
        statusDiv.innerText = "Please fill in at least one search field.";
        resultsDiv.innerHTML = "";
        return;
    }

    showSkeletons();
    statusDiv.innerText = "Fetching articles...";

    let filters = [];

    if (topic) {
        const queryTopic = topic.startsWith('"') ? topic : `"${topic}"`;
        filters.push(`title_and_abstract.search:${encodeURIComponent(queryTopic)}`);
    }
    if (title) {
        const queryTitle = title.startsWith('"') ? title : `"${title}"`;
        filters.push(`title.search:${encodeURIComponent(queryTitle)}`);
    }
    if (journal) filters.push(`primary_location.source.display_name.search:${encodeURIComponent(journal)}`);
    if (author) filters.push(`author.displayName.search:${encodeURIComponent(author)}`);

    if (sortVal === 'cited2Y') {
        const currentYear = new Date().getFullYear();
        filters.push(`publication_year:${currentYear - 2}-${currentYear}`);
    }

    if (selectedPaperType === 'review') {
        filters.push(`type:review`);
    } else if (selectedPaperType === 'research') {
        filters.push(`type:article`);
    }

    // Determine OpenAlex sorting method
    let sortParam = "publication_date:desc";
    if (sortVal === 'cited2Y' || sortVal === 'citedAll') {
        sortParam = "cited_by_count:desc";
    }

    // Over-fetch to allow post-filtering for Journal Impact Factor
    const fetchLimit = Math.max(limit * 4, 40);
    const apiUrl = `https://api.openalex.org/works?filter=${filters.join(',')}&sort=${sortParam}&per_page=${fetchLimit}`;

    try {
        const res = await fetch(apiUrl);
        if (!res.ok) throw new Error(`HTTP error ${res.status}`);
        const data = await res.json();
        let works = data.results || [];

        if (topic) {
            const cleanTopic = topic.replace(/"/g, '').toLowerCase();
            works = works.filter(work => {
                const titleText = (work.display_name || "").toLowerCase();
                const abstractText = getAbstractFromInvertedIndex(work.abstract_inverted_index).toLowerCase();
                return titleText.includes(cleanTopic) || abstractText.includes(cleanTopic);
            });
        }

        // Apply Impact Factor threshold filtering
        if (minIF > 0) {
            works = works.filter(work => {
                const rawIF = work.primary_location?.source?.summary_stats?.['2yr_mean_citedness'] || work.primary_location?.source?.['2yr_mean_citedness'];
                return rawIF !== undefined && rawIF !== null && Number(rawIF) >= minIF;
            });
        }

        works = works.slice(0, limit);

        if (works.length === 0) {
            statusDiv.innerText = "No articles found matching your criteria and Impact Factor filter.";
            resultsDiv.innerHTML = "";
            return;
        }

        statusDiv.innerText = `Displaying ${works.length} articles:`;
        resultsDiv.innerHTML = "";
        const externalIconSvg = `<svg class="external-icon" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>`;

        works.forEach(work => {
            const titleStr = work.display_name || "Untitled Paper";
            const citations = work.cited_by_count || 0;
            const cleanDate = formatCleanDate(work);
            const journalName = work.primary_location?.source?.display_name || 'N/A';
            const url = work.doi || work.ids?.doi || work.id || "#";

            const rawIF = work.primary_location?.source?.summary_stats?.['2yr_mean_citedness'] || work.primary_location?.source?.['2yr_mean_citedness'];
            const impactFactorStr = (rawIF !== undefined && rawIF !== null) ? Number(rawIF).toFixed(2) : "N/A";

            const abstractText = getAbstractFromInvertedIndex(work.abstract_inverted_index);
            const summaryStr = extractTakeaway(abstractText);

            let authorList = 'Unknown Authors';
            let firstInstitution = 'N/A';

            if (work.authorships && work.authorships.length > 0) {
                const names = work.authorships.map(a => a.author?.display_name).filter(Boolean);
                authorList = names.slice(0, 5).join(', ') + (names.length > 5 ? ' et al.' : '');

                const firstAuthorship = work.authorships[0];
                if (firstAuthorship?.institutions && firstAuthorship.institutions.length > 0) {
                    firstInstitution = firstAuthorship.institutions.map(inst => inst.display_name).join(', ');
                } else if (firstAuthorship?.raw_affiliation_strings && firstAuthorship.raw_affiliation_strings.length > 0) {
                    firstInstitution = firstAuthorship.raw_affiliation_strings[0];
                }
            }

            const card = document.createElement('div');
            card.className = 'article-card';
            card.innerHTML = `
                <div class="article-title-row">
                    <h3 class="article-title">
                        <a href="${url}" target="_blank" rel="noopener">
                            <span>${titleStr}</span>
                            ${externalIconSvg}
                        </a>
                    </h3>
                </div>
                <div class="badge-row">
                    <span class="badge impact-factor">📊 JIF: ${impactFactorStr}</span>
                    <span class="badge citation">📌 ${citations.toLocaleString()} ${citations === 1 ? 'citation' : 'citations'}</span>
                    <span class="badge journal">📖 ${journalName}</span>
                    <span class="badge">📅 ${cleanDate}</span>
                </div>
                <div class="authors">
                    <strong>Authors:</strong> ${authorList}
                </div>
                <div class="institution">
                    <strong>Institution (1st Author):</strong> ${firstInstitution}
                </div>
                <div class="paper-summary">
                    <strong>📝 Takeaway:</strong> ${summaryStr}
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    } catch (e) {
        console.error("OpenAlex Fetch Error:", e);
        statusDiv.innerText = "Unable to load articles.";
        resultsDiv.innerHTML = "";
    }
}

window.addEventListener('DOMContentLoaded', () => {
    fetchArticles();
});
</script>
</body>
</html>
